name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL web Danke Mail (Railway)'
        required: false
        default: 'https://imap-production-5bceae6f.up.railway.app/?apk=1'
      app_name:
        description: 'Nama aplikasi Android'
        required: false
        default: 'Danke Mail'
  push:
    branches:
      - main
    paths:
      - 'public/icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android WebView project with Danke Mail logo
        env:
          APP_URL: ${{ github.event.inputs.app_url || 'https://imap-production-5bceae6f.up.railway.app/?apk=1' }}
          APP_NAME: ${{ github.event.inputs.app_name || 'Danke Mail' }}
        run: |
          set -e
          mkdir -p android-build/app/src/main/java/com/dankemail/app
          mkdir -p android-build/app/src/main/res/values
          mkdir -p android-build/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > android-build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DankeMail"
          include(":app")
          EOF

          cat << 'EOF' > android-build/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > android-build/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > android-build/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dankemail.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.dankemail.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName '3.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << EOF > android-build/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          cat << 'EOF' > android-build/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1B367B</color>
          </resources>
          EOF

          cat << 'EOF' > android-build/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.Light.NoActionBar">
                  <item name="android:statusBarColor">#1B367B</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#1B367B</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp android-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          python3 -c "import PIL" 2>/dev/null || pip3 install --quiet pillow
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          src = Image.open("public/icon.png").convert("RGBA")
          r, g, b = src.getpixel((4, 4))[:3]
          hex_bg = f"#{r:02X}{g:02X}{b:02X}"
          with open("android-build/app/src/main/res/values/colors.xml", "w", encoding="utf-8") as f:
              f.write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">{hex_bg}</color>\n</resources>\n')

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }

          for dpi, (legacy_sz, adaptive_sz) in densities.items():
              out_dir = f"android-build/app/src/main/res/mipmap-{dpi}"
              os.makedirs(out_dir, exist_ok=True)

              # Standard square launcher icon
              legacy = src.resize((legacy_sz, legacy_sz), Image.LANCZOS)
              legacy.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")

              # Circular round launcher icon
              mask = Image.new("L", (legacy_sz, legacy_sz), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, legacy_sz - 1, legacy_sz - 1), fill=255)
              rounded = Image.new("RGBA", (legacy_sz, legacy_sz), (0, 0, 0, 0))
              rounded.paste(legacy, (0, 0), mask)
              rounded.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

              # Adaptive icon foreground (72% safe zone so logo is never cropped)
              fg = Image.new("RGBA", (adaptive_sz, adaptive_sz), (0, 0, 0, 0))
              inner = int(adaptive_sz * 0.72)
              resized = src.resize((inner, inner), Image.LANCZOS)
              offset = (adaptive_sz - inner) // 2
              fg.paste(resized, (offset, offset), resized)
              fg.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")

          print("Generated launcher icons for all densities successfully.")
          PYEOF

          cat << EOF > android-build/app/src/main/java/com/dankemail/app/MainActivity.java
          package com.dankemail.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private static final String START_URL = "${APP_URL}";
              private static final String APP_HOST = Uri.parse(START_URL).getHost();
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.setFitsSystemWindows(true);
                  root.setBackgroundColor(Color.parseColor("#FFFDF5"));

                  webView = new WebView(this);
                  webView.setLayoutParams(new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  settings.setUserAgentString(settings.getUserAgentString() + " DankeMailAPK/3.0");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          String host = uri.getHost();
                          if (("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme))
                              && APP_HOST != null && APP_HOST.equalsIgnoreCase(host)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {}
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><body style='font-family:sans-serif;text-align:center;padding:48px 20px;background:#FFFDF5;color:#1A1A1A'>"
                                  + "<h2>Tidak dapat terhubung</h2>"
                                  + "<p>Periksa koneksi internet Anda lalu coba lagi.</p>"
                                  + "<button onclick=\"location.href='" + START_URL + "'\" style='padding:12px 24px;border-radius:12px;border:2px solid #1A1A1A;background:#1E88E5;color:#fff;font-weight:bold;font-size:15px'>Coba Lagi</button>"
                                  + "</body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  root.addView(webView);
                  setContentView(root);

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Android APK
        working-directory: android-build
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          cp android-build/app/build/outputs/apk/debug/app-debug.apk DankeMail.apk
          ls -lh DankeMail.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DankeMail-APK
          path: DankeMail.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk DankeMail.apk \
            --latest \
            --title "Danke Mail Android APK (v3)" \
            --notes "APK Android Danke Mail dengan logo resmi dan tampilan v3. Unduh file DankeMail.apk di bawah lalu install di HP Android Anda."
