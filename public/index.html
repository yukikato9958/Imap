
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan Mail</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:#f6f8fc;color:#202124}
.hide{display:none!important}
.muted{color:#68778c;font-size:13px}
button{border:0;border-radius:22px;padding:10px 17px;background:#0b57d0;color:white;font-weight:600;cursor:pointer;margin:5px 4px 5px 0}
button.secondary{background:#e8eef7;color:#183b66}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}
label{display:block;margin:13px 0 5px;font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#loginCard{max-width:520px;margin:35px auto;padding:25px;background:white;border-radius:18px;border:1px solid #e1e5eb}
#loginCard h1{color:#174ea6}
.status{color:#b42318;font-size:13px}

.mail-header{height:76px;display:flex;align-items:center;gap:18px;padding:10px 22px;background:#f6f8fc;border-bottom:1px solid #e5e7eb}
.mail-brand{display:flex;align-items:center;gap:12px;width:225px;flex-shrink:0}
.mail-brand h2{margin:0;font-size:22px;font-weight:500;color:#444746}
.menu-toggle{background:transparent;color:#444746;font-size:22px;padding:9px 12px;margin:0}
.mail-search{display:flex;align-items:center;gap:10px;background:#eaf1fb;border-radius:28px;padding:5px 16px;max-width:720px;flex:1}
.mail-search input{border:0;outline:0;background:transparent;padding:12px;min-width:0}
.mail-search button{background:transparent;color:#444746;margin:0;padding:8px}
.header-actions{display:flex;align-items:center;gap:5px}
.header-actions button{margin:0}
.account{padding:8px 18px;color:#5f6368;font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mail-layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 76px)}
.mail-sidebar{padding:15px 12px;background:#f6f8fc}
.compose-button{display:block;background:#c2e7ff;color:#001d35;border-radius:16px;padding:17px 25px;margin:5px 0 20px 8px;font-size:14px;box-shadow:0 1px 3px #00000018}
.folders{display:flex;flex-direction:column;gap:4px;padding:0}
.folders button{display:flex;align-items:center;width:100%;text-align:left;padding:10px 20px;border-radius:0 22px 22px 0;background:transparent;color:#444746;margin:0;font-size:14px}
.folders button:hover{background:#edf2fa}
.folders button.active{background:#d3e3fd;color:#041e49;font-weight:700}
.mail-main{min-width:0;padding:12px 20px 25px 5px}
.mail-content{background:white;border-radius:18px;min-height:calc(100vh - 100px);padding:22px}
#folderTitle{font-size:20px;font-weight:500;margin:5px 0 20px}
.msg{display:grid;grid-template-columns:minmax(130px,190px) minmax(0,1fr);align-items:center;gap:15px;padding:14px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.msg:hover{background:#f2f6fc}
.msg b{margin:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg small{color:#68778c;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#readSubject{overflow-wrap:anywhere}
#readMeta{border-bottom:1px solid #e5eaf1;padding-bottom:12px}
.reader{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;padding:15px 0}
#readBody{width:100%;min-width:0;overflow:hidden}
#readBody iframe{display:block;width:100%;min-height:500px;border:0;background:white}
#readBody pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 Arial,sans-serif}
#attachments{padding:12px 0;overflow-wrap:anywhere}

.compose-card{margin-top:18px;border:1px solid #dce3ed;border-radius:12px;padding:18px;max-width:750px;box-shadow:0 3px 12px #00000012}
.compose-card h3{margin-top:0}

@media(max-width:700px){
  .mail-header{min-height:65px;height:auto;padding:8px 10px;flex-wrap:wrap;gap:8px}
  .mail-brand{width:auto;flex:1}
  .mail-brand h2{font-size:19px}
  .mail-search{order:3;flex-basis:100%;max-width:none}
  .header-actions button{padding:8px 10px;font-size:12px}
  .mail-layout{display:block;min-height:calc(100vh - 65px)}
  .mail-sidebar{display:none;position:absolute;z-index:20;top:65px;left:0;width:265px;min-height:calc(100vh - 65px);background:#f6f8fc;box-shadow:4px 5px 15px #0002}
  .mail-sidebar.open{display:block}
  .mail-main{padding:8px}
  .mail-content{padding:14px 10px;border-radius:14px}
  .msg{grid-template-columns:1fr;gap:5px;padding:13px 8px}
  .msg small{white-space:normal}
  .row{grid-template-columns:1fr}
  #readBody iframe{min-height:450px}
}
</style>
</head>

<body>

<section id="loginCard">
  <h1>Japan Mail</h1>
  <p class="muted">Web IMAP/SMTP Client • Provider Presets & Auto-Detection</p>
  <h2>Sign in to Email</h2>

  <label>Email Address</label>
  <input id="email" type="email" placeholder="name@provider.jp">

  <label>Email Provider</label>
  <select id="provider"><option value="">Loading providers...</option></select>
  <p class="muted" id="providerNote">Loading provider list...</p>

  <div class="row">
    <div>
      <label>IMAP Host</label>
      <input id="imapHost" placeholder="imap.example.jp">
    </div>
    <div>
      <label>IMAP Port</label>
      <input id="imapPort" value="993" type="number">
    </div>
  </div>

  <label><input id="imapSecure" type="checkbox" checked style="width:auto"> IMAP SSL/TLS</label>

  <div class="row">
    <div>
      <label>SMTP Host</label>
      <input id="smtpHost" placeholder="smtp.example.jp">
    </div>
    <div>
      <label>SMTP Port</label>
      <input id="smtpPort" value="465" type="number">
    </div>
  </div>

  <label><input id="smtpSecure" type="checkbox" checked style="width:auto"> SMTP SSL/TLS</label>

  <label>Password / App Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <button id="loginBtn">Sign In</button>
  <span id="loginStatus" class="status"></span>

  <p class="muted">Use an app password if required by your provider. IMAP/SMTP access must be enabled by your email provider.</p>
</section>

<section id="mailCard" class="hide">

  <header class="mail-header">
    <div class="mail-brand">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h2>Japan Mail</h2>
    </div>

    <div class="mail-search">
      <input id="searchInput" type="search" placeholder="Search emails...">
      <button id="searchBtn" title="Search">⌕</button>
      <button id="clearSearch" title="Clear">✕</button>
    </div>

    <div class="header-actions">
      <button class="secondary" id="refresh">↻</button>
      <button class="secondary" id="logout">Logout</button>
    </div>
  </header>

  <div class="account" id="accountLabel"></div>

  <div class="mail-layout">
    <aside class="mail-sidebar" id="mailSidebar">
      <button class="compose-button" id="composeBtn">✎ Compose</button>
      <nav class="folders" id="folders">
        <p class="muted">Loading folders...</p>
      </nav>
    </aside>

    <main class="mail-main">
      <div class="mail-content">

        <div id="listPane">
          <h3 id="folderTitle">Inbox</h3>
          <div id="inbox"></div>
        </div>

        <div id="readerPane" class="hide">
          <button class="secondary" id="backBtn">← Back to Messages</button>
          <h3 id="readSubject"></h3>
          <p class="muted" id="readMeta"></p>
          <div class="reader" id="readBody"></div>
          <div id="attachments" class="muted"></div>
        </div>

        <div id="compose" class="compose-card hide">
          <h3>Compose Email</h3>

          <label>To</label>
          <input id="to" type="email" placeholder="recipient@example.com">

          <label>Subject</label>
          <input id="subject" placeholder="Enter subject">

          <label>Message</label>
          <textarea id="body" rows="7" placeholder="Write your message..."></textarea>

          <button id="send">Send Email</button>
          <span id="sendStatus" class="muted"></span>
        </div>

      </div>
    </main>
  </div>
</section>

<script src="/providers.js?v=20261111"
onerror="document.getElementById('providerNote').textContent='Failed to load providers.js. Check public/providers.js.'"></script>

<script>
const $ = id => document.getElementById(id);

let token = '';
let currentFolder = 'INBOX';
let providerList = [];
let currentMessages = [];

function applyProvider(p) {
  if (!p) return;
  $('imapHost').value = p.imapHost || '';
  $('imapPort').value = p.imapPort || 993;
  $('imapSecure').checked = p.imapSecure !== false;
  $('smtpHost').value = p.smtpHost || '';
  $('smtpPort').value = p.smtpPort || 465;
  $('smtpSecure').checked = p.smtpSecure !== false;
  $('providerNote').textContent = p.notes || '';
}

function initProviders() {
  const select = $('provider');

  if (!Array.isArray(window.PROVIDERS) || !window.PROVIDERS.length) {
    select.innerHTML = '<option value="manual">Other / Manual Setup</option>';
    $('providerNote').textContent = 'Provider list could not be loaded. Check public/providers.js.';
    return;
  }

  providerList = window.PROVIDERS;
  select.innerHTML = '';

  providerList.forEach(p => {
    const option = document.createElement('option');
    option.value = p.id;
    option.textContent = p.name;
    select.appendChild(option);
  });

  const initial = providerList.find(p => p.id === 'dti') || providerList[0];
  select.value = initial.id;
  applyProvider(initial);

  $('providerNote').textContent = 'Successfully loaded ' + providerList.length + ' providers.';

  $('email').addEventListener('input', () => {
    const email = $('email').value.trim().toLowerCase();
    const detected = typeof window.detectProvider === 'function'
      ? window.detectProvider(email)
      : providerList.find(p => p.domains && p.domains.includes(email.split('@')[1]))
        || providerList.find(p => p.id === 'manual');

    if (detected) {
      select.value = detected.id;
      applyProvider(detected);
    }
  });

  select.addEventListener('change', () => {
    applyProvider(providerList.find(p => p.id === select.value));
  });
}

initProviders();

async function api(path, opt = {}) {
  opt.headers = {
    ...(opt.headers || {}),
    'Content-Type': 'application/json',
    ...(token ? { Authorization: 'Bearer ' + token } : {})
  };

  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));

  if (!r.ok) throw Error(j.error || r.statusText);
  return j;
}

$('loginBtn').onclick = async () => {
  $('loginStatus').textContent = 'Connecting...';

  try {
    const j = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({
        email: $('email').value,
        password: $('password').value,
        imapHost: $('imapHost').value,
        imapPort: $('imapPort').value,
        imapSecure: $('imapSecure').checked,
        smtpHost: $('smtpHost').value,
        smtpPort: $('smtpPort').value,
        smtpSecure: $('smtpSecure').checked
      })
    });

    token = j.token;
    $('accountLabel').textContent = j.email;
    $('loginCard').classList.add('hide');
    $('mailCard').classList.remove('hide');
    $('loginStatus').textContent = '';

    await loadFolders();
  } catch (e) {
    $('loginStatus').textContent = e.message;
  }
};

function folderLabel(f) {
  const s = String(f.specialUse || '').toLowerCase();
  const p = String(f.path || '').toLowerCase();
  const n = String(f.name || '').toLowerCase();

  if (s.includes('inbox') || p === 'inbox') return 'Inbox';
  if (s.includes('sent') || /sent|送信/.test(p + ' ' + n)) return 'Sent';
  if (s.includes('draft') || /draft|下書き/.test(p + ' ' + n)) return 'Drafts';
  if (s.includes('trash') || /trash|deleted|ゴミ箱/.test(p + ' ' + n)) return 'Trash';
  if (s.includes('junk') || /spam|junk|迷惑/.test(p + ' ' + n)) return 'Spam';
  if (s.includes('archive') || /archive|アーカイブ/.test(p + ' ' + n)) return 'Archive';

  return f.name || f.path;
}

async function loadFolders() {
  try {
    const j = await api('/api/folders');
    const fs = j.folders || [];

    $('folders').innerHTML = '';

    if (!fs.some(f => f.path === currentFolder)) {
      currentFolder = fs.find(f => String(f.path).toUpperCase() === 'INBOX')?.path
        || fs[0]?.path || 'INBOX';
    }

    fs.forEach(f => {
      const b = document.createElement('button');
      b.textContent = folderLabel(f);
      b.className = f.path === currentFolder ? 'active' : '';

      b.onclick = () => {
        currentFolder = f.path;
        loadFolders();
        $('mailSidebar').classList.remove('open');
      };

      $('folders').append(b);
    });

    await loadInbox();
  } catch (e) {
    $('folders').textContent = e.message;
  }
}

function renderMessages(messages) {
  $('inbox').innerHTML = '';

  if (!messages.length) {
    $('inbox').textContent = 'No messages found.';
    return;
  }

  messages.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg';

    const sender = document.createElement('b');
    sender.textContent = m.from || 'Unknown sender';

    const details = document.createElement('small');
    details.textContent = (m.subject || '(No subject)') +
      ' · ' + (m.date ? new Date(m.date).toLocaleString() : '');

    d.append(sender, details);
    d.onclick = () => readMail(m.uid);

    $('inbox').append(d);
  });
}

async function loadInbox() {
  $('listPane').classList.remove('hide');
  $('readerPane').classList.add('hide');
  $('compose').classList.add('hide');
  $('searchInput').value = '';

  $('folderTitle').textContent = folderLabel({
    path: currentFolder,
    name: currentFolder
  });

  $('inbox').textContent = 'Loading messages...';

  try {
    const j = await api('/api/inbox?folder=' + encodeURIComponent(currentFolder));
    currentMessages = j.messages || [];

    $('folderTitle').textContent = folderLabel({
      path: currentFolder,
      name: currentFolder
    }) + ' (' + currentMessages.length + ')';

    renderMessages(currentMessages);
  } catch (e) {
    $('inbox').textContent = e.message;
  }
}

function searchEmails() {
  const query = $('searchInput').value.trim().toLowerCase();

  if (!query) {
    renderMessages(currentMessages);
    return;
  }

  const filtered = currentMessages.filter(m => {
    const text = [
      m.subject || '',
      m.from || '',
      m.to || '',
      m.text || ''
    ].join(' ').toLowerCase();

    return text.includes(query);
  });

  renderMessages(filtered);

  if (!filtered.length) {
    $('inbox').textContent = 'No matching emails found.';
  }
}

$('searchBtn').onclick = searchEmails;
$('searchInput').addEventListener('input', searchEmails);
$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchEmails();
});

$('clearSearch').onclick = () => {
  $('searchInput').value = '';
  renderMessages(currentMessages);
};

async function readMail(uid) {
  $('listPane').classList.add('hide');
  $('readerPane').classList.remove('hide');

  $('readSubject').textContent = 'Loading message...';
  $('readMeta').textContent = '';
  $('readBody').innerHTML = '';
  $('attachments').textContent = '';

  try {
    const m = await api('/api/message/' + uid + '?folder=' +
      encodeURIComponent(currentFolder));

    $('readSubject').textContent = m.subject || '(No subject)';
    $('readMeta').textContent = 'From: ' + (m.from || '') +
      ' | To: ' + (m.to || '') +
      ' | ' + (m.date ? new Date(m.date).toLocaleString() : '');

    if (m.htmlAvailable && m.html) {
      const frame = document.createElement('iframe');

      frame.setAttribute('sandbox', '');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      frame.setAttribute('title', 'Email content');

      frame.style.width = '100%';
      frame.style.minHeight = '500px';
      frame.style.height = '70vh';
      frame.style.border = '0';
      frame.style.background = '#fff';

      frame.srcdoc = m.html;
      $('readBody').appendChild(frame);
    } else {
      const pre = document.createElement('pre');
      pre.style.whiteSpace = 'pre-wrap';
      pre.style.overflowWrap = 'anywhere';
      pre.textContent = m.text || '(Empty message)';
      $('readBody').appendChild(pre);
    }

    if (m.attachments && m.attachments.length) {
      $('attachments').textContent = 'Attachments: ' +
        m.attachments.map(a =>
          a.filename + ' (' + a.size + ' bytes)' +
          (a.inline ? ' - Inline image' : '')
        ).join(', ');
    }
  } catch (e) {
    $('readSubject').textContent = 'Unable to open email';
    $('readBody').textContent = e.message;
  }
}

$('menuToggle').onclick = () => {
  $('mailSidebar').classList.toggle('open');
};

$('refresh').onclick = loadFolders;

$('backBtn').onclick = () => {
  $('readerPane').classList.add('hide');
  $('listPane').classList.remove('hide');
};

$('composeBtn').onclick = () => {
  $('listPane').classList.add('hide');
  $('readerPane').classList.add('hide');
  $('compose').classList.remove('hide');
  $('mailSidebar').classList.remove('open');
};

$('send').onclick = async () => {
  $('sendStatus').textContent = 'Sending...';

  try {
    await api('/api/send', {
      method: 'POST',
      body: JSON.stringify({
        to: $('to').value,
        subject: $('subject').value,
        text: $('body').value
      })
    });

    $('sendStatus').textContent = 'Email sent successfully.';
    $('to').value = '';
    $('subject').value = '';
    $('body').value = '';
  } catch (e) {
    $('sendStatus').textContent = e.message;
  }
};

$('logout').onclick = async () => {
  try {
    await api('/api/logout', { method: 'POST' });
  } catch {}

  token = '';
  $('mailCard').classList.add('hide');
  $('loginCard').classList.remove('hide');
};
</script>

</body>
</html>
