<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Mail</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f3f6fa;color:#182235;margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #172b4d08}h1{margin:4px 0;color:#163e72}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}button{padding:12px 16px;border:0;border-radius:10px;background:#1766bd;color:white;font-weight:700;margin:8px 4px 0 0}button.secondary{background:#e8eef7;color:#183b66}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#68778c;font-size:13px}.msg{padding:12px;border-bottom:1px solid #e5eaf1}.msg button{float:right}.hide{display:none}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>Japan Mail</h1><p class="muted">Web IMAP/SMTP client • Provider preset & auto-detection</p>
<div class="card" id="loginCard"><h2>Login email</h2>
<label>Alamat email</label><input id="email" type="email" placeholder="nama@provider.jp">
<label>Provider (otomatis dari domain)</label><select id="provider"></select><p class="muted" id="providerNote"></p>
<div class="row"><div><label>IMAP Host</label><input id="imapHost" placeholder="imap.example.jp"></div><div><label>IMAP Port</label><input id="imapPort" value="993" type="number"></div></div>
<label><input id="imapSecure" type="checkbox" checked style="width:auto"> IMAP SSL/TLS</label>
<div class="row"><div><label>SMTP Host</label><input id="smtpHost" placeholder="smtp.example.jp"></div><div><label>SMTP Port</label><input id="smtpPort" value="465" type="number"></div></div>
<label><input id="smtpSecure" type="checkbox" checked style="width:auto"> SMTP SSL/TLS</label>
<label>Password / App Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">Login</button><span id="loginStatus" class="muted"></span>
<p class="muted">Gunakan app password jika provider mewajibkannya. Jangan gunakan password utama bila tidak yakin akses IMAP aman.</p></div>
<div class="card hide" id="mailCard"><button class="secondary" id="refresh">Refresh inbox</button><button class="secondary" id="composeBtn">Tulis email</button><button class="secondary" id="logout">Logout</button><div id="inbox"></div>
<div id="compose" class="hide"><h3>Kirim email</h3><label>Ke</label><input id="to"><label>Subjek</label><input id="subject"><label>Pesan</label><textarea id="body" rows="5"></textarea><button id="send">Kirim</button><span id="sendStatus"></span></div></div>
</div><script src="providers.js"></script><script>
const $=id=>document.getElementById(id);let token='';
PROVIDERS.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('provider').append(o)});
function applyProvider(p){$('imapHost').value=p.imapHost;$('imapPort').value=p.imapPort;$('imapSecure').checked=p.imapSecure;$('smtpHost').value=p.smtpHost;$('smtpPort').value=p.smtpPort;$('smtpSecure').checked=p.smtpSecure;$('providerNote').textContent=p.notes||''}
$('provider').addEventListener('change',()=>applyProvider(PROVIDERS.find(p=>p.id===$('provider').value)));
$('email').addEventListener('input',()=>{const p=detectProvider($('email').value);$('provider').value=p.id;applyProvider(p)});
applyProvider(PROVIDERS[0]);$('provider').value='dti';
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(path,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.statusText);return j}
$('loginBtn').onclick=async()=>{ $('loginStatus').textContent='Menghubungkan…';try{let j=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value,imapHost:$('imapHost').value,imapPort:$('imapPort').value,imapSecure:$('imapSecure').checked,smtpHost:$('smtpHost').value,smtpPort:$('smtpPort').value,smtpSecure:$('smtpSecure').checked})});token=j.token;$('loginCard').classList.add('hide');$('mailCard').classList.remove('hide');$('loginStatus').textContent='';loadInbox()}catch(e){$('loginStatus').textContent=e.message}};
async function loadInbox(){try{let j=await api('/api/inbox');$('inbox').innerHTML='<h3>Inbox ('+j.messages.length+')</h3>'+j.messages.map(m=>'<div class="msg"><b>'+esc(m.subject)+'</b><br><small>'+esc(m.from)+' · '+(m.date?new Date(m.date).toLocaleString():'')+'</small><button class="secondary" onclick="readMail('+m.uid+')">Buka</button></div>').join('')}catch(e){$('inbox').textContent=e.message}}
window.readMail=async uid=>{try{let m=await api('/api/message/'+uid);alert('From: '+(m.envelope?.from?.[0]?.address||'')+'\\nSubject: '+(m.envelope?.subject||'')+'\\n\\n'+m.source)}catch(e){alert(e.message)}};
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('refresh').onclick=loadInbox;$('composeBtn').onclick=()=>$('compose').classList.toggle('hide');$('send').onclick=async()=>{try{await api('/api/send',{method:'POST',body:JSON.stringify({to:$('to').value,subject:$('subject').value,text:$('body').value})});$('sendStatus').textContent='Email terkirim';}catch(e){$('sendStatus').textContent=e.message}};
$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}token='';$('mailCard').classList.add('hide');$('loginCard').classList.remove('hide')};
</script></body></html>
