<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7257d8">
<title>Danke Mail</title>
<style>
:root{
  --bg:#f5f3fb;--surface:#fff;--surface2:#f0edfa;
  --text:#211d32;--muted:#89849b;--line:#e9e5f1;
  --primary:#7257d8;--primary2:#5b40c4;
  --danger:#e45b70;--success:#269b75;
  --shadow:0 12px 35px rgba(43,30,86,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.brand{font-size:25px;font-weight:800;letter-spacing:-1px}
.brand span{color:var(--primary)}
.logo{
 width:42px;height:42px;border-radius:14px;background:var(--primary);
 color:white;display:grid;place-items:center;font-size:21px;font-weight:800;
 box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 30%,transparent)
}
.primary{
 border:0;background:var(--primary);color:white;padding:12px 18px;
 border-radius:11px;font-weight:700
}
.primary:hover{background:var(--primary2)}
.secondary{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:10px}
.danger{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{
 width:100%;border:1px solid var(--line);background:var(--surface);
 color:var(--text);padding:12px 13px;border-radius:10px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
.field textarea{resize:vertical;min-height:120px}
.row{display:flex;gap:10px}
.row>*{min-width:0;flex:1}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 35%),var(--bg)}
.login-wrap{width:100%;max-width:520px}
.login-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}
.login-card h1{font-size:23px;margin:0 0 7px}
.login-card .subtitle{color:var(--muted);margin:0 0 25px}
.login-footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.provider-note{padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:12px;color:var(--muted);margin:10px 0 15px;line-height:1.5}
#dashboard{height:100vh;display:flex;overflow:hidden}
.sidebar{width:255px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.account-switch{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);text-align:left;margin-bottom:18px}
.account-switch strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-label{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--muted);padding:10px 11px}
.folder-list{overflow:auto;flex:1}
.folder-btn{display:flex;align-items:center;gap:11px;width:100%;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;margin:2px 0}
.folder-btn:hover,.folder-btn.active{background:var(--surface2);color:var(--primary)}
.folder-btn .folder-count{margin-left:auto;color:var(--muted);font-size:11px}
.side-bottom{border-top:1px solid var(--line);padding-top:12px}
.side-bottom button{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-radius:9px}
.side-bottom button:hover{background:var(--surface2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:70px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.searchbox{max-width:650px;flex:1;position:relative}
.searchbox input{width:100%;padding:12px 15px 12px 40px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);outline:none}
.searchbox span{position:absolute;left:14px;top:10px;font-size:18px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text)}
.content{padding:24px;overflow:auto;flex:1}
.content-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.content-head h2{font-size:22px;margin:0}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar button{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)}
.toolbar button:hover{border-color:var(--primary);color:var(--primary)}
.mail-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mail-row{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.mail-row:last-child{border-bottom:0}
.mail-row:hover{background:var(--surface2)}
.mail-row.unread .sender,.mail-row.unread .subject{font-weight:800}
.mail-row input{accent-color:var(--primary)}
.mail-info{min-width:0;flex:1}
.sender{font-weight:600;margin-bottom:4px}
.subject{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.mail-date{font-size:11px;color:var(--muted);white-space:nowrap}

/* SENDER LOGO */
.sender-line{display:flex;align-items:center;gap:10px;min-width:0}
.sender-avatar{
 width:38px;height:38px;min-width:38px;border-radius:50%;
 overflow:hidden;display:grid;place-items:center;
 background:var(--surface2);color:var(--text);
 font-weight:800;font-size:14px;border:1px solid var(--line)
}
.sender-avatar img{
 width:100%;height:100%;object-fit:contain;
 padding:5px;background:#fff;border-radius:50%
}
.sender-avatar .avatar-fallback{
 display:grid;place-items:center;width:100%;height:100%
}
.sender-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-sender-avatar{width:46px;height:46px;min-width:46px}

/* PAGINATION */
.pagination{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;flex-wrap:wrap;padding:15px 4px;margin-top:10px
}
.pagination-info{font-size:12px;color:var(--muted)}
.pagination-controls{display:flex;align-items:center;gap:8px}
.pagination-controls button{
 border:1px solid var(--line);background:var(--surface);
 color:var(--text);padding:9px 13px;border-radius:9px;font-weight:600
}
.pagination-controls button:hover:not(:disabled){
 border-color:var(--primary);color:var(--primary)
}
.pagination-controls button:disabled{opacity:.4;cursor:not-allowed}
.page-indicator{
 min-width:105px;text-align:center;font-size:12px;
 color:var(--muted);font-weight:700
}
.page-size-select{
 border:1px solid var(--line);background:var(--surface);
 color:var(--text);padding:8px;border-radius:9px;font-size:12px
}
.empty{padding:65px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
#messageView{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.message-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.message-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 12px;border-radius:9px}
.message-meta{padding:15px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.message-body{line-height:1.7;overflow-wrap:anywhere}
.message-body iframe{width:100%;min-height:420px;border:0;background:white}
.modal-backdrop{position:fixed;inset:0;background:#16122688;z-index:40;display:flex;align-items:center;justify-content:center;padding:15px}
.modal{width:100%;max-width:570px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px;padding:23px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{margin:0;font-size:19px}
.close{border:0;background:var(--surface2);color:var(--text);border-radius:9px;width:34px;height:34px}
.toast{position:fixed;bottom:22px;right:22px;z-index:50;background:#29243b;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);max-width:90vw}
.theme-options{display:flex;gap:9px;flex-wrap:wrap}
.theme-dot{width:30px;height:30px;border:3px solid var(--surface);outline:1px solid var(--line);border-radius:50%}

.mobile-menu{display:none}

.sidebar-close{
 display:none;
 border:0;
 background:var(--surface2);
 color:var(--text);
 width:34px;
 height:34px;
 border-radius:9px;
 font-size:18px;
}

.sidebar-overlay{
 display:none;
}

@media(max-width:760px){
 #dashboard{height:100dvh}

 .sidebar{
  position:fixed;
  z-index:30;
  left:-270px;
  top:0;
  bottom:0;
  transition:left .2s;
  box-shadow:var(--shadow);
 }

 .sidebar.open{left:0}

 .sidebar-close{
  display:block;
  margin-left:auto;
  flex-shrink:0;
 }

 .sidebar-overlay{
  position:fixed;
  inset:0;
  background:rgba(20,15,35,.48);
  z-index:25;
 }

 .sidebar-overlay.active{display:block}

 .mobile-menu{display:inline-block}
 .topbar{padding:0 12px;height:62px;gap:8px}
 .content{padding:15px 11px}
 .content-head h2{font-size:19px}
 .mail-row{padding:13px 10px;gap:8px}
 .mail-date{display:none}
 .login-card{padding:22px 18px}
 .row.mobile-stack{display:block}
 .row.mobile-stack>*{width:100%}
 .pagination{align-items:flex-start}
 .pagination-controls{width:100%;justify-content:space-between}
 .pagination-controls button{padding:9px 10px}
 .page-indicator{min-width:90px}
}

/* ===== DANKE MAIL PREMIUM LAVENDER REDESIGN ===== */
:root{
 --bg:#f5f1ff;--surface:#fff;--surface2:#eee7ff;
 --text:#21183d;--muted:#81769e;--line:#e5ddf5;
 --primary:#7040df;--primary2:#5b2fc7;
 --shadow:0 18px 48px rgba(48,24,105,.12);
}
body{
 background:radial-gradient(ellipse at 50% 0%,#e7d9ff 0%,#f5f1ff 48%,#eee8ff 100%);
 color:var(--text);
}
.logo{
 background:linear-gradient(145deg,#a58aff 0%,#7545e8 52%,#4a26b5 100%);
 border-radius:14px;color:#fff;
 box-shadow:0 8px 22px rgba(103,64,216,.35);
}
.brand{letter-spacing:-1.15px}
.brand span{color:#a78bfa}
.primary{
 background:linear-gradient(110deg,#7c4cf0,#6033d4);
 box-shadow:0 6px 16px rgba(104,62,220,.2);
}
.primary:hover{background:linear-gradient(110deg,#6d3ee0,#5126bf)}
#dashboard{
 margin:18px; height:calc(100vh - 36px);
 border-radius:22px;overflow:hidden;background:#fff;
 box-shadow:0 22px 65px rgba(57,30,125,.2);
}
.sidebar{
 width:255px;background:linear-gradient(180deg,#261746 0%,#1d1235 100%);
 border-right:0;color:#f8f5ff;padding:22px 14px;
}
.sidebar .brand{color:#fff}
.sidebar .brand span{color:#bda7ff}
.sidebar .account-switch{
 background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);
 color:#fff;
}
.sidebar .side-label{color:#a99bc8}
.sidebar .folder-btn{color:#e8e0ff}
.sidebar .folder-btn:hover,.sidebar .folder-btn.active{
 background:linear-gradient(100deg,#7040df,#5630bd);color:#fff;
 box-shadow:0 7px 18px rgba(12,5,35,.18);
}
.sidebar .folder-btn .folder-count{color:#c8b9ef}
.sidebar .side-bottom{border-color:rgba(255,255,255,.14)}
.sidebar .side-bottom button{color:#e8e0ff}
.sidebar .side-bottom button:hover{background:rgba(255,255,255,.08)}
.topbar{
 height:76px;background:#fff;border-bottom:1px solid #eee8fa;padding:0 24px;
}
.searchbox input{background:#f3effc;border:1px solid transparent;border-radius:16px}
.searchbox input:focus{border-color:#c8b6ff;box-shadow:0 0 0 3px #8b5cf61a}
.icon-btn{border:0;background:#f5f1ff;border-radius:12px;color:#5d4a91}
.content{padding:22px;background:linear-gradient(180deg,#fff 0%,#fcfbff 100%)}
.content-head h2{font-size:23px;letter-spacing:-.5px}
.mail-list{border:0;border-radius:14px;background:#fff}
.mail-row{padding:15px 13px;border-bottom:1px solid #f0ebf8}
.mail-row:hover{background:#f8f5ff}
.mail-row.unread{background:#f0e9ff}
.mail-row.unread .sender,.mail-row.unread .subject{color:#2c1c57}
.sender-avatar{width:40px;height:40px;min-width:40px;box-shadow:0 3px 10px #38206b12}
.toolbar button{border:0;background:#f5f1ff;border-radius:10px}
.toolbar button:hover{background:#e9ddff}
#messageView{
 border:1px solid #eee8fa;border-radius:16px;padding:24px;
 box-shadow:0 8px 24px rgba(44,20,95,.04);background:#fff;
}
.message-toolbar button{background:#f6f2ff;border:0}
.message-meta{border-color:#eee8fa}
.modal{border:1px solid #eee8fa}
.login-card{box-shadow:0 20px 55px rgba(57,30,125,.12);border-radius:24px}
.provider-note{background:#f3effc}
.toast{background:#281744}
@media(min-width:761px){
 #contentHead{grid-column:1/-1}
 .content:has(#messageView:not(.hidden)){
  display:grid;grid-template-columns:minmax(310px,42%) minmax(0,1fr);
  align-content:start;align-items:start;gap:18px;
 }
 .content:has(#messageView:not(.hidden)) #listView{min-width:0}
 .content:has(#messageView:not(.hidden)) #messageView{
  display:block!important;min-width:0;max-height:calc(100vh - 165px);overflow:auto;
 }
 .content:has(#messageView:not(.hidden)) .content-head{grid-column:1/-1}
}
@media(max-width:760px){
 #dashboard{margin:0;height:100dvh;border-radius:0}
 .sidebar{background:linear-gradient(180deg,#261746,#1d1235)}
 .content:has(#messageView:not(.hidden)){display:block}
}


/* FIX KONTRAS: teks inbox dan toolbar harus terbaca */
.content, .content * { opacity: 1; }
.content { color: #302744 !important; }
.content-head h2 { color: #302044 !important; }
.content-head, .content-head * { color: #5b4b78; }
.mail-row, .mail-row * { opacity: 1 !important; }
.mail-row .sender,
.mail-row .subject,
.mail-row .snippet,
.mail-row .mail-date { color: #33254f !important; }
.mail-row .sender { font-weight: 700 !important; }
.mail-row .subject { color: #6b5a8e !important; }
.mail-row .snippet { color: #75688d !important; }
.mail-row .mail-date { color: #8b80a3 !important; }
.toolbar button { color: #4b376f !important; }
.toolbar button:disabled { opacity: .65 !important; color: #75658f !important; }
.content-head h2, #contentHead h2 { color: #33204f !important; }
.content-head p, #contentHead p { color: #76668f !important; }

</style>
<style id="theme-aware-background-fix">
/* ===== THEME-AWARE BACKGROUND & SURFACES (FIX) ===== */
body{
 background:
   radial-gradient(ellipse at 15% 0%, color-mix(in srgb,var(--primary) 16%,transparent), transparent 48%),
   radial-gradient(ellipse at 90% 18%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 42%),
   var(--bg) !important;
 color:var(--text) !important;
 transition:background .25s,color .2s;
}
#dashboard{
 background:var(--surface) !important;
 box-shadow:0 22px 65px color-mix(in srgb,var(--primary) 18%,transparent) !important;
}
.topbar{background:var(--surface) !important;color:var(--text) !important}
.content{
 background:
  linear-gradient(180deg,
   color-mix(in srgb,var(--primary) 3%,var(--surface)) 0%,
   var(--surface) 100%) !important;
 color:var(--text) !important;
}
.mail-list,.modal,.account-switch,.mail-row,
.toolbar button,.message-toolbar button{
 background-color:var(--surface) !important;
 color:var(--text) !important;
 border-color:var(--line) !important;
}
.mail-row:hover,.folder-btn:hover{
 background-color:var(--surface2) !important;
}
.searchbox input{
 background:var(--surface2) !important;
 color:var(--text) !important;
 border-color:var(--line) !important;
}
input,select,textarea{color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted)}
.content-head h2,.sender,.subject,.mail-preview,.message-meta,
.message-toolbar,.pagination,.page-indicator{color:var(--text)}
.mail-preview,.mail-date,.page-indicator{color:var(--muted)}
/* Theme mode: true dark surfaces, including inbox and reading pane */
html[style*="--bg:"] body{background-color:var(--bg)}
@media(prefers-reduced-motion:reduce){body{transition:none}}
</style>

 background:#342849!important;color:#eee6ff!important;border-color:#4b3b61!important;
}
html[data-danke-mode="dark"] .sidebar{color:#f8f5ff!important}
html[data-danke-mode="dark"] .message-body iframe{background:#fff!important}
</style>


<style id="accent-theme-functional-fix">
/* Selected accent color is applied to all theme accents */
:root{
 --accent-soft:color-mix(in srgb,var(--primary) 12%,var(--surface));
 --accent-glow:color-mix(in srgb,var(--primary) 24%,transparent);
}
body{
 background:
  radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--primary) 20%,transparent),transparent 48%),
  radial-gradient(ellipse at 92% 20%,color-mix(in srgb,var(--primary) 13%,transparent),transparent 45%),
  var(--bg)!important;
}
#dashboard{box-shadow:0 22px 65px color-mix(in srgb,var(--primary) 22%,transparent)!important}
.logo,.primary,#connectBtn,#composeBtn,#addAccountBtn{
 background:linear-gradient(115deg,
  color-mix(in srgb,var(--primary) 82%,white),
  var(--primary),
  color-mix(in srgb,var(--primary) 78%,black))!important;
 border-color:var(--primary)!important;
}
.primary:hover,#connectBtn:hover,#composeBtn:hover,#addAccountBtn:
