
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

}

[data-theme="dark"]{

 --text:#e8eaed;

 --soft:#26364f;
 --danger:#ff8a80;

[data-theme="pink"]{

 --surface:#fff;

[data-theme="blue"]{

[data-theme="green"]{

 --surface:#fff;
 --surface2:#ddf1e3;

 --line:#c9e5d1;

 --soft:#d8f1df;

[data-theme="orange"]{

 --soft:#ffead2;

[data-theme="purple"]{

*{

}

html,body{

 padding:0;

 overflow-x:hidden;
}

body{

}

button,input,textarea,select{

}

button{

}

button:disabled{

}

/* HEADER */

.top{
 min-height:64px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:10px 20px;
 background:var(--surface);
 border-bottom:1px solid var(--line);
 position:sticky;
 top:0;
 z-index:5;
 width:100%;
}

.logo{
 font-size:21px;
 font-weight:700;
 color:var(--accent);
 white-space:nowrap;
 flex-shrink:0;
}

.search{
 flex:1;
 min-width:0;
 max-width:700px;
 display:flex;
 background:var(--bg);
 border:1px solid var(--line);
 border-radius:24px;

}

.search input{

 background:transparent;

 min-width:0;

 color:var(--text);
}

.iconbtn,.btn{
 border:0;
 border-radius:10px;
 padding:9px 13px;
 background:var(--soft);
 color:var(--text);
}

.btn.primary{
 background:var(--accent);
 color:white;
}

.theme-select{
 border:1px solid var(--line);
 border-radius:10px;
 padding:9px 11px;
 background:var(--bg);
 color:var(--text);
 outline-color:var(--accent);
 cursor:pointer;
 max-width:150px;
}

/* LAYOUT */

.layout{
 display:flex;
 width:100%;
 min-height:calc(100vh - 64px);
 min-width:0;
}

.sidebar{
 width:235px;
 flex-shrink:0;
 padding:18px 12px;
 border-right:1px solid var(--line);
 background:var(--bg);
}

.compose{
 width:100%;
 padding:13px;
 margin:0 0 18px;
 border-radius:16px;
 border:0;
 background:var(--soft);
 color:var(--text);
 font-weight:700;
 text-align:left;
}

.nav{
 display:flex;
 align-items:center;
 gap:12px;
 padding:10px 14px;
 border-radius:0 22px 22px 0;
 margin:3px 0;
 cursor:pointer;
}

.nav.active,.nav:hover{

 color:var(--accent);
}

.main{
 flex:1;
 min-width:0;
 width:100%;
 padding:20px;
 overflow-x:hidden;
}

/* TOOLBAR */

.toolbar{
 display:flex;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:16px;
}

.heading{
 font-size:20px;
 font-weight:700;
 margin-right:auto;
}

/* MESSAGE LIST */

.panel{
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:14px;
 overflow:hidden;
 width:100%;
 min-width:0;
}

.message{
 display:flex;
 gap:12px;
 padding:13px 16px;
 border-bottom:1px solid var(--line);
 cursor:pointer;
 align-items:center;
 min-width:0;
}

.message:hover{

}

.message.unread .sender,
.message.unread .subject{

}

.sender{

 overflow:hidden;

 white-space:nowrap;
}

.subject{

 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.date{
 color:var(--muted);
 white-space:nowrap;
 font-size:12px;
}

.status{
 padding:16px;
 color:var(--muted);
}

.error{
 color:var(--danger);
 white-space:pre-wrap;
}

/* LOGIN */

.loginwrap{
 min-height:100vh;
 min-height:100dvh;
 display:grid;
 place-items:center;
 padding:20px;
 width:100%;
}

.login{

 border-radius:18px;

}

.login h1{

}

}

 align-items:center;

 gap:12px;
 margin-bottom:18px;
 padding:12px;
 background:var(--bg);
 border:1px solid var(--line);

}

.field{
 display:grid;
 gap:6px;
 margin:13px 0;
 min-width:0;
}

.field label{
 font-weight:600;
}

.field input,
.field select,
.field textarea{
 padding:11px 12px;
 border:1px solid var(--line);
 border-radius:9px;
 background:var(--bg);
 color:var(--text);
 width:100%;
 min-width:0;
 max-width:100%;
 outline-color:var(--accent);
}

.login .btn{
 width:100%;
 padding:12px;
}

.small{

 color:var(--muted);
}

/* MAIL VIEW */

.mailview{

 min-width:0;
 overflow-wrap:anywhere;
}

.mailview h2{
 margin:16px 0 12px;

}

.mailmeta{
 color:var(--muted);
 margin-bottom:20px;
 overflow-wrap:anywhere;
}

.mailbody{
 overflow-wrap:anywhere;
 white-space:pre-wrap;

}

.mailbody img{

 height:auto;
}

.mailbody iframe{

}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#0007;
 display:none;
 place-items:center;
 z-index:10;
 padding:18px;
}

.modal.show{

}

.dialog{

 max-height:90vh;
 max-height:90dvh;
 overflow:auto;
 background:var(--surface);

.dialoghead{

 align-items:center;

.dialoghead h2{

.footerrow{

<script>
const $ = id => document.getElementById(id);

const STORAGE_SESSION = 'dankeSessionId';
const STORAGE_ACCOUNT = 'dankeAccount';
const STORAGE_FOLDER = 'dankeCurrentFolder';

let sessionId = localStorage.getItem(STORAGE_SESSION) || null;

let currentFolder =
 localStorage.getItem(STORAGE_FOLDER) || 'INBOX';

let currentPage = 1;
let currentMessages = [];
let searchResults = null;

let account = {
 email:'',
 smtpHost:'',
 smtpPort:465,
 smtpSecure:true
};

let folders = [];

const themes = [
 {id:'light',name:'☀️ Light'},
 {id:'dark',name:'🌙 Dark'},
 {id:'pink',name:'💗 Pink'},
 {id:'blue',name:'💙 Blue'},
 {id:'green',name:'💚 Green'},
 {id:'orange',name:'🧡 Orange'},
 {id:'purple',name:'💜 Purple'}
];

// ========================================
// HTML ESCAPE
// ========================================

function esc(s=''){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

// ========================================
// THEME
// ========================================

function theme(){
 const saved = localStorage.getItem('dankeTheme') || 'light';

 const valid = themes.some(t=>t.id===saved)
  ? saved
  : 'light';

 document.documentElement.dataset.theme = valid;

 const selector = $('themeSelect');
 if(selector) selector.value = valid;

 const loginSelector = $('loginThemeSelect');
 if(loginSelector) loginSelector.value = valid;
}

function setTheme(value){
 const valid = themes.some(t=>t.id===value)
  ? value
  : 'light';

 localStorage.setItem('dankeTheme',valid);

 document.documentElement.dataset.theme = valid;

 const selector = $('themeSelect');
 if(selector) selector.value = valid;

 const loginSelector = $('loginThemeSelect');
 if(loginSelector) loginSelector.value = valid;
}

function themeOptions(){
 return themes.map(t=>
  `<option value="${t.id}">${t.name}</option>`
 ).join('');
}

theme();

// ========================================
// SAVE SESSION
// ========================================

function saveSession(){
 if(sessionId){
  localStorage.setItem(STORAGE_SESSION,sessionId);
 }

 localStorage.setItem(
  STORAGE_ACCOUNT,
  JSON.stringify(account)
 );

 localStorage.setItem(
  STORAGE_FOLDER,
  currentFolder
 );
}

function clearSavedSession(){
 localStorage.removeItem(STORAGE_SESSION);
 localStorage.removeItem(STORAGE_ACCOUNT);
 localStorage.removeItem(STORAGE_FOLDER);
}

// ========================================

    </div>

      type="number"

      required>
    </div>

      <option value="true">SSL/TLS</option>

    </div>

     <input id="smtpHost"
      placeholder="smtp.example.jp">
    </div>

      type="number"

    </div>

    <div class="field">

    <button class="btn primary" id="loginBtn">

   <p class="small">

 theme();

// ========================================
// PROVIDER DETECTION
// ========================================

function setupProviderDetection(){
 const select = $('providerSelect');
 const email = $('email');

 if(!select || !email || !window.PROVIDERS) return;

 select.innerHTML = window.PROVIDERS.map(p=>
  `<option value="${esc(p.id)}">${esc(p.name)}</option>`
 ).join('');

 function applyProvider(p){
  if(!p) return;

  select.value = p.id;

  $('imapHost').value = p.imapHost || '';
  $('imapPort').value = p.imapPort || 993;
  $('imapSecure').value = String(p.imapSecure !== false);

  $('smtpHost').value = p.smtpHost || '';
  $('smtpPort').value = p.smtpPort || 465;
  $('smtpSecure').value = String(p.smtpSecure !== false);

  $('providerStatus').textContent =
   p.id === 'manual'
    ? 'Provider tidak terdeteksi. Isi server manual.'
    : 'Provider terdeteksi: ' + p.name;
 }

 email.addEventListener('input',()=>{
  const p = window.detectProvider
   ? window.detectProvider(email.value)
   : window.PROVIDERS.find(p=>p.id==='manual');

  applyProvider(p);
 });

 select.addEventListener('change',()=>{
  applyProvider(
   window.PROVIDERS.find(p=>p.id===select.value)
  );
 });

 applyProvider(
  window.detectProvider
   ? window.detectProvider(email.value)
   : window.PROVIDERS.find(p=>p.id==='manual')
 );
}

// ========================================
// API
// ========================================

async function api(path,options={}){
 const headers = {...(options.headers || {})};

 if(sessionId){
  headers['x-session-id'] = sessionId;
 }

 if(options.body){
  headers['Content-Type'] = 'application/json';
 }

 const response = await fetch(path,{
  ...options,
  headers
 });

 let data;

 try{
  data = await response.json();
 }catch{
  data = {};
 }

 if(!response.ok){
  throw new Error(
   data.details?.message ||
   data.error ||
   `HTTP ${response.status}`
  );
 }

 return data;
}

// ========================================
// LOGIN
// ========================================

async function doLogin(e){
 e.preventDefault();

 const btn = $('loginBtn');

 btn.disabled = true;
 btn.textContent = 'Connecting…';

 $('loginError').textContent = '';

 const email = $('email').value.trim();
 const password = $('password').value;
 const host = $('imapHost').value.trim();

 account = {
  email,
  smtpHost:$('smtpHost').value.trim(),
  smtpPort:Number($('smtpPort').value || 465),
  smtpSecure:$('smtpSecure').value === 'true'
 };

 try{
  const data = await api('/api/login',{
   method:'POST',
   body:JSON.stringify({
    host,
    port:Number($('imapPort').value || 993),
    secure:$('imapSecure').value === 'true',
    username:email,
    password
   })
  });

  if(!data.sessionId){
   throw new Error('Server did not return a session ID.');
  }

  sessionId = data.sessionId;

  currentFolder = 'INBOX';
  currentPage = 1;

  saveSession();

  shell();

  await loadFolders();
  await showMail();

 }catch(err){
  $('loginError').textContent = err.message;

  btn.disabled = false;
  btn.textContent = 'Sign in';
 }
}

// ========================================
// RESTORE SESSION
// ========================================

async function restoreSession(){
 const savedSession = localStorage.getItem(STORAGE_SESSION);

 if(!savedSession){
  loginScreen();
  return;
 }

 sessionId = savedSession;

 try{
  const savedAccount = localStorage.getItem(STORAGE_ACCOUNT);

  if(savedAccount){
   account = JSON.parse(savedAccount);
  }

  currentFolder =
   localStorage.getItem(STORAGE_FOLDER) || 'INBOX';

  await loadFolders();

  shell();

  await showMail();

 }catch(err){
  console.warn('Session restore failed:',err.message);

  sessionId = null;
  folders = [];

  clearSavedSession();

  loginScreen(
   'Your session has expired. Please sign in again.'
  );
 }
}

// ========================================
// MAIN APP
// ========================================

function shell(){
 $('app').innerHTML = `
 <header class="top">

  <div class="logo">✉ Danke Mail</div>

  <div class="search">
   <input id="searchInput"
    placeholder="Search all mail">
   <button class="iconbtn"
    onclick="searchMail()">Search</button>
  </div>

  <select id="themeSelect"
   class="theme-select"
   title="Change theme"
   onchange="setTheme(this.value)">
   ${themeOptions()}
  </select>

  <button class="iconbtn"
   onclick="logout()">Sign out</button>

 </header>

 <div class="layout">

  <aside class="sidebar">

   <button class="compose"
    onclick="openCompose()">✎ Compose</button>

   <div id="folderNav"></div>

  </aside>

  <main class="main">

   <div class="toolbar">

    <div class="heading" id="pageTitle">Inbox</div>

    <button class="btn"
     onclick="clearSearch()">Clear Search</button>

    <button class="btn"
     onclick="showMail()">↻ Refresh</button>

    <button class="btn"
     onclick="changePage(-1)">←</button>

    <span id="pageLabel">Page 1</span>

    <button class="btn"
     onclick="changePage(1)">→</button>

   </div>

   <div class="panel" id="mailPanel">
    <div class="status">Loading…</div>
   </div>

  </main>
 </div>`;

 theme();

 $('searchInput').addEventListener('keydown',e=>{
  if(e.key === 'Enter') searchMail();
 });
}

// ========================================
// FOLDERS
// ========================================

function folderLabel(f){
 const s = (
  f.specialUse ||
  f.name ||
  f.path ||
  ''
 ).toLowerCase();

 if(s.includes('inbox')) return 'Inbox';
 if(s.includes('sent')) return 'Sent';
 if(s.includes('trash') || s.includes('deleted')) return 'Trash';
 if(s.includes('draft')) return 'Drafts';
 if(s.includes('junk') || s.includes('spam')) return 'Spam';
 if(s.includes('archive')) return 'Archive';

 return f.name || f.path;
}

async function loadFolders(){
 const data = await api('/api/folders');

 folders = Array.isArray(data)
  ? data
  : (data.folders || []);

 if(!folders.some(f=>
  (f.path || f.name || '').toLowerCase()==='inbox'
 )){
  folders.unshift({
   name:'INBOX',
   path:'INBOX',
   specialUse:'\\Inbox'
  });
 }
}

function renderFolders(){
 const nav = $('folderNav');
 if(!nav) return;

 nav.innerHTML = folders.map(f=>{
  const path = f.path || f.name;

  return `
   <div class="nav ${path===currentFolder?'active':''}"
    onclick="selectFolder('${esc(path).replace(/'/g,"\\'")}')">
    <span>${folderIcon(f)}</span>
    <span>${esc(folderLabel(f))}</span>
   </div>`;
 }).join('');
}

function folderIcon(f){
 const n = folderLabel(f).toLowerCase();

 return n==='inbox'?'▣':
  n==='sent'?'➤':
  n==='drafts'?'▤':
  n==='trash'?'♲':
  n==='spam'?'⚠':'▰';
}

// ========================================
// MESSAGES
// ========================================

function renderMessages(messages){
 const panel = $('mailPanel');
 if(!panel) return;

 if(!messages || !messages.length){
  panel.innerHTML =
   '<div class="status">No messages found.</div>';
  return;
 }

 panel.innerHTML = messages.map(m=>`
  <div class="message ${(m.flags||[]).includes('\\Seen')?'':'unread'}"
   onclick="openMessage(${Number(m.uid)},'${esc(m.folder || currentFolder).replace(/'/g,"\\'")}')">

   <div class="sender">
    ${esc(m.from || '(Unknown sender)')}
   </div>

   <div class="subject">
    ${esc(m.subject || '(No subject)')}
    ${m.folder ? `<span class="small"> · ${esc(m.folder)}</span>` : ''}
   </div>

   <div class="date">
    ${m.date ? new Date(m.date).toLocaleDateString() : ''}
   </div>

  </div>
 `).join('');
}

// ========================================
// SHOW MAIL
// ========================================

async function showMail(){
 if(!sessionId) return;

 searchResults = null;

 renderFolders();

 const panel = $('mailPanel');
 if(!panel) return;

 $('pageTitle').textContent = folderLabel(
  folders.find(f=>
   (f.path || f.name)===currentFolder
  ) || {name:currentFolder}
 );

 panel.innerHTML =
  '<div class="status">Loading messages…</div>';

 try{
  const data = await api(
   `/api/inbox?folder=${encodeURIComponent(currentFolder)}&page=${currentPage}&limit=25`
  );

  currentMessages = data.messages || [];

  $('pageLabel').textContent = `Page ${currentPage}`;

  renderMessages(currentMessages);

 }catch(err){
  panel.innerHTML =
   `<div class="status error">${esc(err.message)}</div>`;
 }
}

// ========================================
// SEARCH
// ========================================

async function searchMail(){
 const input = $('searchInput');
 const panel = $('mailPanel');

 if(!input || !panel) return;

 const query = input.value.trim();

 if(!query){
  return showMail();
 }

 panel.innerHTML =
  `<div class="status">Searching all folders for "${esc(query)}"…</div>`;

 $('pageTitle').textContent = 'Search Results';

 try{
  const data = await api(
   `/api/search?q=${encodeURIComponent(query)}&limit=200`
  );

  searchResults = data.messages || [];

  $('pageLabel').textContent =
   `${data.total} result(s)`;

  renderMessages(searchResults);

 }catch(err){
  panel.innerHTML =
   `<div class="status error">${esc(err.message)}</div>`;
 }
}

function clearSearch(){
 const input = $('searchInput');

 if(input) input.value = '';

 searchResults = null;
 currentPage = 1;

 showMail();
}

// ========================================
// FOLDER NAVIGATION
// ========================================

async function selectFolder(path){
 currentFolder = path;
 currentPage = 1;

 localStorage.setItem(
  STORAGE_FOLDER,
  currentFolder
 );

 await showMail();
}

async function changePage(d){
 if(searchResults) return;

 currentPage = Math.max(1,currentPage+d);

 await showMail();
}

// ========================================
// OPEN MESSAGE
// ========================================

async function openMessage(uid,folder=currentFolder){
 const panel = $('mailPanel');

 if(!panel) return;

 panel.innerHTML =
  '<div class="status">Opening message…</div>';

 try{
  const m = await api(
   `/api/message/${uid}?folder=${encodeURIComponent(folder)}`
  );

  panel.innerHTML = `
   <div class="mailview">

    <button class="btn"
     onclick="backFromMessage()">← Back</button>

    <h2>${esc(m.subject)}</h2>

    <div class="mailmeta">
     From: ${esc(m.from)}<br>
     To: ${esc(m.to)}<br>
     ${m.cc ? 'Cc: '+esc(m.cc)+'<br>' : ''}
     ${esc(m.date ? new Date(m.date).toLocaleString() : '')}
    </div>

    <hr>

    <div class="mailbody">
     ${m.html ? sanitizeHtml(m.html) : esc(m.text)}
    </div>

   </div>`;

 }catch(err){
  panel.innerHTML =
   `<div class="status error">${esc(err.message)}</div>`;
 }
}

function backFromMessage(){
 if(searchResults){
  renderMessages(searchResults);
 }else{
  showMail();
 }
}

// ========================================
// BASIC HTML SANITIZER
// ========================================

function sanitizeHtml(html){
 return String(html)
  .replace(/<script[\s\S]*?<\/script>/gi,'')
  .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'')
  .replace(/javascript:/gi,'');
}

// ========================================
// COMPOSE
// ========================================

function openCompose(){
 $('composeModal').classList.add('show');
}

function closeCompose(){
 $('composeModal').classList.remove('show');
}

$('composeForm').addEventListener('submit',async e=>{
 e.preventDefault();

 const btn = e.submitter;

 btn.disabled = true;
 btn.textContent = 'Sending…';

 try{
  await api('/api/send',{
   method:'POST',
   body:JSON.stringify({
    to:$('to').value,
    subject:$('subject').value,
    text:$('bodyText').value,
    smtpHost:account.smtpHost,
    smtpPort:account.smtpPort,
    smtpSecure:account.smtpSecure
   })
  });

  closeCompose();

  $('composeForm').reset();

  alert('Message sent.');

 }catch(err){
  alert('Send failed: '+err.message);

 }finally{
  btn.disabled = false;
  btn.textContent = 'Send';
 }
});

// ========================================
// LOGOUT
// ========================================

async function logout(){
 try{
  await api('/api/logout',{
   method:'POST',
   body:JSON.stringify({sessionId})
  });

 }catch(err){
  console.warn('Logout request failed:',err.message);
 }

 sessionId = null;
 currentFolder = 'INBOX';
 currentPage = 1;
 currentMessages = [];
 searchResults = null;
 folders = [];

 clearSavedSession();

 loginScreen();
}

// ========================================
// START APPLICATION
// ========================================

restoreSession();

</script>
</body>
</html>
