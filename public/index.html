<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7257d8">
<title>Danke Mail</title>
<style>
:root{
  --bg:#f5f3fb;--surface:#fff;--surface2:#f0edfa;
  --text:#211d32;--muted:#89849b;--line:#e9e5f1;
  --primary:#7257d8;--primary2:#5b40c4;
  --danger:#e45b70;--success:#269b75;
  --shadow:0 12px 35px rgba(43,30,86,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.brand{font-size:25px;font-weight:800;letter-spacing:-1px}
.brand span{color:var(--primary)}
.logo{
 width:42px;height:42px;border-radius:14px;background:var(--primary);
 color:white;display:grid;place-items:center;font-size:21px;font-weight:800;
 box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 30%,transparent)
}
.primary{
 border:0;background:var(--primary);color:white;padding:12px 18px;
 border-radius:11px;font-weight:700
}
.primary:hover{background:var(--primary2)}
.secondary{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:10px}
.danger{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{
 width:100%;border:1px solid var(--line);background:var(--surface);
 color:var(--text);padding:12px 13px;border-radius:10px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
.field textarea{resize:vertical;min-height:120px}
.row{display:flex;gap:10px}
.row>*{min-width:0;flex:1}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 35%),var(--bg)}
.login-wrap{width:100%;max-width:520px}
.login-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}
.login-card h1{font-size:23px;margin:0 0 7px}
.login-card .subtitle{color:var(--muted);margin:0 0 25px}
.login-footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.provider-note{padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:12px;color:var(--muted);margin:10px 0 15px;line-height:1.5}
#dashboard{height:100vh;display:flex;overflow:hidden}
.sidebar{width:255px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.account-switch{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);text-align:left;margin-bottom:18px}
.account-switch strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-label{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--muted);padding:10px 11px}
.folder-list{overflow:auto;flex:1}
.folder-btn{display:flex;align-items:center;gap:11px;width:100%;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;margin:2px 0}
.folder-btn:hover,.folder-btn.active{background:var(--surface2);color:var(--primary)}
.folder-btn .folder-count{margin-left:auto;color:var(--muted);font-size:11px}
.side-bottom{border-top:1px solid var(--line);padding-top:12px}
.side-bottom button{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-radius:9px}
.side-bottom button:hover{background:var(--surface2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:70px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.searchbox{max-width:650px;flex:1;position:relative}
.searchbox input{width:100%;padding:12px 15px 12px 40px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);outline:none}
.searchbox span{position:absolute;left:14px;top:10px;font-size:18px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text)}
.content{padding:24px;overflow:auto;flex:1}
.content-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.content-head h2{font-size:22px;margin:0}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar button{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)}
.toolbar button:hover{border-color:var(--primary);color:var(--primary)}
.mail-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mail-row{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.mail-row:last-child{border-bottom:0}
.mail-row:hover{background:var(--surface2)}
.mail-row.unread .sender,.mail-row.unread .subject{font-weight:800}
.mail-row input{accent-color:var(--primary)}
.mail-info{min-width:0;flex:1}
.sender{font-weight:600;margin-bottom:4px}
.subject{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.mail-date{font-size:11px;color:var(--muted);white-space:nowrap}

/* SENDER LOGO */
.sender-line{display:flex;align-items:center;gap:10px;min-width:0}
.sender-avatar{
 width:38px;height:38px;min-width:38px;border-radius:50%;
 overflow:hidden;display:grid;place-items:center;
 background:var(--surface2);color:var(--text);
 font-weight:800;font-size:14px;border:1px solid var(--line)
}
.sender-avatar img{
 width:100%;height:100%;object-fit:contain;
 padding:5px;background:#fff;border-radius:50%
}
.sender-avatar .avatar-fallback{
 display:grid;place-items:center;width:100%;height:100%
}
.sender-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-sender-avatar{width:46px;height:46px;min-width:46px}

/* PAGINATION */
.pagination{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;flex-wrap:wrap;padding:15px 4px;margin-top:10px
}
.pagination-info{font-size:12px;color:var(--muted)}
.pagination-controls{display:flex;align-items:center;gap:8px}
.pagination-controls button{
 border:1px solid var(--line);background:var(--surface);
 color:var(--text);padding:9px 13px;border-radius:9px;font-weight:600
}
.pagination-controls button:hover:not(:disabled){
 border-color:var(--primary);color:var(--primary)
}
.pagination-controls button:disabled{opacity:.4;cursor:not-allowed}
.page-indicator{
 min-width:105px;text-align:center;font-size:12px;
 color:var(--muted);font-weight:700
}
.page-size-select{
 border:1px solid var(--line);background:var(--surface);
 color:var(--text);padding:8px;border-radius:9px;font-size:12px
}
.empty{padding:65px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
#messageView{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.message-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.message-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 12px;border-radius:9px}
.message-meta{padding:15px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.message-body{line-height:1.7;overflow-wrap:anywhere}
.message-body iframe{width:100%;min-height:420px;border:0;background:white}
.modal-backdrop{position:fixed;inset:0;background:#16122688;z-index:40;display:flex;align-items:center;justify-content:center;padding:15px}
.modal{width:100%;max-width:570px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px;padding:23px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{margin:0;font-size:19px}
.close{border:0;background:var(--surface2);color:var(--text);border-radius:9px;width:34px;height:34px}
.toast{position:fixed;bottom:22px;right:22px;z-index:50;background:#29243b;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);max-width:90vw}
.theme-options{display:flex;gap:9px;flex-wrap:wrap}
.theme-dot{width:30px;height:30px;border:3px solid var(--surface);outline:1px solid var(--line);border-radius:50%}

.mobile-menu{display:none}

.sidebar-close{
 display:none;
 border:0;
 background:var(--surface2);
 color:var(--text);
 width:34px;
 height:34px;
 border-radius:9px;
 font-size:18px;
}

.sidebar-overlay{
 display:none;
}

@media(max-width:760px){
 #dashboard{height:100dvh}

 .sidebar{
  position:fixed;
  z-index:30;
  left:-270px;
  top:0;
  bottom:0;
  transition:left .2s;
  box-shadow:var(--shadow);
 }

 .sidebar.open{left:0}

 .sidebar-close{
  display:block;
  margin-left:auto;
  flex-shrink:0;
 }

 .sidebar-overlay{
  position:fixed;
  inset:0;
  background:rgba(20,15,35,.48);
  z-index:25;
 }

 .sidebar-overlay.active{display:block}

 .mobile-menu{display:inline-block}
 .topbar{padding:0 12px;height:62px;gap:8px}
 .content{padding:15px 11px}
 .content-head h2{font-size:19px}
 .mail-row{padding:13px 10px;gap:8px}
 .mail-date{display:none}
 .login-card{padding:22px 18px}
 .row.mobile-stack{display:block}
 .row.mobile-stack>*{width:100%}
 .pagination{align-items:flex-start}
 .pagination-controls{width:100%;justify-content:space-between}
 .pagination-controls button{padding:9px 10px}
 .page-indicator{min-width:90px}
}

/* ===== DANKE MAIL PREMIUM LAVENDER REDESIGN ===== */
:root{
 --bg:#f5f1ff;--surface:#fff;--surface2:#eee7ff;
 --text:#21183d;--muted:#81769e;--line:#e5ddf5;
 --primary:#7040df;--primary2:#5b2fc7;
 --shadow:0 18px 48px rgba(48,24,105,.12);
}
body{
 background:radial-gradient(ellipse at 50% 0%,#e7d9ff 0%,#f5f1ff 48%,#eee8ff 100%);
 color:var(--text);
}
.logo{
 background:linear-gradient(145deg,#a58aff 0%,#7545e8 52%,#4a26b5 100%);
 border-radius:14px;color:#fff;
 box-shadow:0 8px 22px rgba(103,64,216,.35);
}
.brand{letter-spacing:-1.15px}
.brand span{color:#a78bfa}
.primary{
 background:linear-gradient(110deg,#7c4cf0,#6033d4);
 box-shadow:0 6px 16px rgba(104,62,220,.2);
}
.primary:hover{background:linear-gradient(110deg,#6d3ee0,#5126bf)}
#dashboard{
 margin:18px; height:calc(100vh - 36px);
 border-radius:22px;overflow:hidden;background:#fff;
 box-shadow:0 22px 65px rgba(57,30,125,.2);
}
.sidebar{
 width:255px;background:linear-gradient(180deg,#261746 0%,#1d1235 100%);
 border-right:0;color:#f8f5ff;padding:22px 14px;
}
.sidebar .brand{color:#fff}
.sidebar .brand span{color:#bda7ff}
.sidebar .account-switch{
 background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);
 color:#fff;
}
.sidebar .side-label{color:#a99bc8}
.sidebar .folder-btn{color:#e8e0ff}
.sidebar .folder-btn:hover,.sidebar .folder-btn.active{
 background:linear-gradient(100deg,#7040df,#5630bd);color:#fff;
 box-shadow:0 7px 18px rgba(12,5,35,.18);
}
.sidebar .folder-btn .folder-count{color:#c8b9ef}
.sidebar .side-bottom{border-color:rgba(255,255,255,.14)}
.sidebar .side-bottom button{color:#e8e0ff}
.sidebar .side-bottom button:hover{background:rgba(255,255,255,.08)}
.topbar{
 height:76px;background:#fff;border-bottom:1px solid #eee8fa;padding:0 24px;
}
.searchbox input{background:#f3effc;border:1px solid transparent;border-radius:16px}
.searchbox input:focus{border-color:#c8b6ff;box-shadow:0 0 0 3px #8b5cf61a}
.icon-btn{border:0;background:#f5f1ff;border-radius:12px;color:#5d4a91}
.content{padding:22px;background:linear-gradient(180deg,#fff 0%,#fcfbff 100%)}
.content-head h2{font-size:23px;letter-spacing:-.5px}
.mail-list{border:0;border-radius:14px;background:#fff}
.mail-row{padding:15px 13px;border-bottom:1px solid #f0ebf8}
.mail-row:hover{background:#f8f5ff}
.mail-row.unread{background:#f0e9ff}
.mail-row.unread .sender,.mail-row.unread .subject{color:#2c1c57}
.sender-avatar{width:40px;height:40px;min-width:40px;box-shadow:0 3px 10px #38206b12}
.toolbar button{border:0;background:#f5f1ff;border-radius:10px}
.toolbar button:hover{background:#e9ddff}
#messageView{
 border:1px solid #eee8fa;border-radius:16px;padding:24px;
 box-shadow:0 8px 24px rgba(44,20,95,.04);background:#fff;
}
.message-toolbar button{background:#f6f2ff;border:0}
.message-meta{border-color:#eee8fa}
.modal{border:1px solid #eee8fa}
.login-card{box-shadow:0 20px 55px rgba(57,30,125,.12);border-radius:24px}
.provider-note{background:#f3effc}
.toast{background:#281744}
@media(min-width:761px){
 #contentHead{grid-column:1/-1}
 .content:has(#messageView:not(.hidden)){
  display:grid;grid-template-columns:minmax(310px,42%) minmax(0,1fr);
  align-content:start;align-items:start;gap:18px;
 }
 .content:has(#messageView:not(.hidden)) #listView{min-width:0}
 .content:has(#messageView:not(.hidden)) #messageView{
  display:block!important;min-width:0;max-height:calc(100vh - 165px);overflow:auto;
 }
 .content:has(#messageView:not(.hidden)) .content-head{grid-column:1/-1}
}
@media(max-width:760px){
 #dashboard{margin:0;height:100dvh;border-radius:0}
 .sidebar{background:linear-gradient(180deg,#261746,#1d1235)}
 .content:has(#messageView:not(.hidden)){display:block}
}


/* FIX KONTRAS: teks inbox dan toolbar harus terbaca */
.content, .content * { opacity: 1; }
.content { color: #302744 !important; }
.content-head h2 { color: #302044 !important; }
.content-head, .content-head * { color: #5b4b78; }
.mail-row, .mail-row * { opacity: 1 !important; }
.mail-row .sender,
.mail-row .subject,
.mail-row .snippet,
.mail-row .mail-date { color: #33254f !important; }
.mail-row .sender { font-weight: 700 !important; }
.mail-row .subject { color: #6b5a8e !important; }
.mail-row .snippet { color: #75688d !important; }
.mail-row .mail-date { color: #8b80a3 !important; }
.toolbar button { color: #4b376f !important; }
.toolbar button:disabled { opacity: .65 !important; color: #75658f !important; }
.content-head h2, #contentHead h2 { color: #33204f !important; }
.content-head p, #contentHead p { color: #76668f !important; }

</style>
<style id="theme-aware-background-fix">
/* ===== THEME-AWARE BACKGROUND & SURFACES (FIX) ===== */
body{
 background:
   radial-gradient(ellipse at 15% 0%, color-mix(in srgb,var(--primary) 16%,transparent), transparent 48%),
   radial-gradient(ellipse at 90% 18%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 42%),
   var(--bg) !important;
 color:var(--text) !important;
 transition:background .25s,color .2s;
}
#dashboard{
 background:var(--surface) !important;
 box-shadow:0 22px 65px color-mix(in srgb,var(--primary) 18%,transparent) !important;
}
.topbar{background:var(--surface) !important;color:var(--text) !important}
.content{
 background:
  linear-gradient(180deg,
   color-mix(in srgb,var(--primary) 3%,var(--surface)) 0%,
   var(--surface) 100%) !important;
 color:var(--text) !important;
}
.mail-list,.modal,.account-switch,.mail-row,
.toolbar button,.message-toolbar button{
 background-color:var(--surface) !important;
 color:var(--text) !important;
 border-color:var(--line) !important;
}
.mail-row:hover,.folder-btn:hover{
 background-color:var(--surface2) !important;
}
.searchbox input{
 background:var(--surface2) !important;
 color:var(--text) !important;
 border-color:var(--line) !important;
}
input,select,textarea{color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted)}
.content-head h2,.sender,.subject,.mail-preview,.message-meta,
.message-toolbar,.pagination,.page-indicator{color:var(--text)}
.mail-preview,.mail-date,.page-indicator{color:var(--muted)}
/* Theme mode: true dark surfaces, including inbox and reading pane */
html[style*="--bg:"] body{background-color:var(--bg)}
@media(prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>

<section id="loginPage">
 <div class="login-wrap">
  <div class="login-brand">
   <div class="logo">D</div>
   <div class="brand">Danke <span>Mail</span></div>
  </div>
  <div class="login-card">
   <h1>Connect your email</h1>
   <p class="subtitle">Masuk menggunakan akun email kamu.</p>
   <form id="loginForm">
    <div class="field">
     <label>EMAIL ADDRESS</label>
     <input id="email" type="email" placeholder="nama@example.com" autocomplete="username" required>
    </div>
    <div class="field">
     <label>PASSWORD</label>
     <input id="password" type="password" placeholder="Password email" autocomplete="current-password" required>
    </div>
    <div class="field">
     <label>EMAIL PROVIDER</label>
     <select id="provider"></select>
    </div>
    <div class="provider-note" id="providerNote">Provider akan terdeteksi otomatis berdasarkan domain email.</div>
    <div class="field">
     <label>IMAP HOST</label>
     <input id="imapHost" placeholder="imap.example.com" required>
    </div>
    <div class="row">
     <div class="field">
      <label>IMAP PORT</label>
      <input id="imapPort" type="number" value="993" required>
     </div>
     <div class="field">
      <label>IMAP SECURITY</label>
      <select id="imapSecure">
       <option value="true">SSL / TLS</option>
       <option value="false">STARTTLS / None</option>
      </select>
     </div>
    </div>
    <div class="field">
     <label>SMTP HOST</label>
     <input id="smtpHost" placeholder="smtp.example.com" required>
    </div>
    <div class="row">
     <div class="field">
      <label>SMTP PORT</label>
      <input id="smtpPort" type="number" value="465" required>
     </div>
     <div class="field">
      <label>SMTP SECURITY</label>
      <select id="smtpSecure">
       <option value="true">SSL / TLS</option>
       <option value="false">STARTTLS / None</option>
      </select>
     </div>
    </div>
    <button class="primary" id="connectBtn" type="submit" style="width:100%">Connect Account</button>
   </form>
  </div>
  <div class="login-footer">Danke Mail · IMAP / SMTP Email Client</div>
 </div>
</section>

<section id="dashboard" class="hidden">
 <div class="sidebar-overlay" id="sidebarOverlay"></div>
 <aside class="sidebar" id="sidebar">
 <div class="side-brand">
 <div class="logo">D</div>
 <div class="brand">Danke <span>Mail</span></div>
 <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
</div>
  <button class="account-switch" id="accountSwitch">
   <span class="small muted">CURRENT ACCOUNT</span>
   <strong id="accountLabel">Email account</strong>
   <span class="small muted">▾ Switch account</span>
  </button>
  <button class="primary" id="addAccountBtn" style="width:100%;margin-bottom:15px">＋ Add Account</button>
  <div class="side-label">MAILBOXES</div>
  <div class="folder-list" id="folderList"></div>
  <div class="side-bottom">
   <button id="themeBtn">◐ Appearance & Theme</button>
   <button id="logoutBtn" class="danger">↪ Logout</button>
  </div>
 </aside>
 <main class="main">
  <header class="topbar">
   <button class="icon-btn mobile-menu" id="menuBtn">☰</button>
   <div class="searchbox">
    <span>⌕</span>
    <input id="searchInput" placeholder="Search all folders...">
   </div>
   <div class="top-actions">
    <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
    <button class="primary" id="composeBtn">＋ Compose</button>
   </div>
  </header>
  <div class="content">
   <div class="content-head">
    <div>
     <h2 id="pageTitle">Inbox</h2>
     <div class="small muted" id="pageSubtitle">Your messages</div>
    </div>
   </div>
   <div id="listView">
    <div class="toolbar">
     <button id="selectAllBtn">Select all</button>
     <button id="readBtn">Mark read</button>
     <button id="unreadBtn">Mark unread</button>
     <button id="deleteBtn" class="danger">Delete</button>
     <button id="clearSearchBtn" class="hidden">Clear search</button>
    </div>
    <div class="mail-list" id="mailList">
     <div class="empty"><div class="big">✉</div>Loading messages...</div>
    </div>

    <div class="pagination" id="pagination">
     <div class="pagination-info" id="paginationInfo">0 email</div>
     <div class="pagination-controls">
      <select class="page-size-select" id="pageSizeSelect" title="Emails per page">
       <option value="25">25</option>
       <option value="50" selected>50</option>

window.detectProvider=function(email){
 const value=(email||'').trim().toLowerCase();
 const at=value.lastIndexOf('@');
 if(at<1||at===value.length-1)return window.PROVIDERS.find(p=>p.id==='manual');
 const domain=value.substring(at+1);
 return window.PROVIDERS.find(p=>p.id!=='manual'&&p.domains.some(item=>{
  const base=item.toLowerCase();
  return domain===base||(p.matchSubdomains&&domain.endsWith('.'+base));
 }))||window.PROVIDERS.find(p=>p.id==='manual');
};

/* SENDER LOGO DETECTOR */
function senderAvatar(sender,large=false){
 const raw=String(sender||'').trim();
 const emailMatch=raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
 const email=emailMatch?emailMatch[0]:'';
 const domain=(email.split('@')[1]||'').toLowerCase();

 const known=[
  [/^(gmail\.com|googlemail\.com)$/,'google.com'],
  [/^(amazon\.com|amazon\.co\.jp|amazonaws\.com)$/,'amazon.com'],
  [/^(yahoo\.com|yahoo\.co\.jp)$/,'yahoo.com'],
  [/^(outlook\.com|hotmail\.com|live\.com|microsoft\.com)$/,'microsoft.com'],
  [/^(icloud\.com|me\.com|mac\.com)$/,'apple.com'],
  [/^youtube\.com$/,'youtube.com'],
  [/^(shopee\.co\.id|shopee\.com)$/,'shopee.co.id'],
  [/^netflix\.com$/,'netflix.com'],
  [/^rakuten\.co\.jp$/,'rakuten.co.jp'],
  [/^biglobe\.ne\.jp$/,'biglobe.ne.jp'],
  [/^ocn\.ne\.jp$/,'ocn.ne.jp'],
  [/^so-net\.ne\.jp$/,'so-net.ne.jp'],
  [/^mineo\.jp$/,'mineo.jp'],
  [/^spotify\.com$/,'spotify.com'],
  [/^paypal\.com$/,'paypal.com'],
  [/^adobe\.com$/,'adobe.com'],
  [/^discord\.com$/,'discord.com'],
  [/^steampowered\.com$/,'steampowered.com']
 ];

 const match=known.find(([pattern])=>pattern.test(domain));
 const logoDomain=match?match[1]:domain;
 const displayName=raw.replace(/<[^>]*>/g,'').replace(/["']/g,'').trim();
 const seed=displayName||email||'?';
 const initials=seed.split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase()||'?';
 const src=logoDomain?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(logoDomain)+'&sz=128':'';

 return `<div class="sender-avatar ${large?'message-sender-avatar':''}">
  ${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}
  <span class="avatar-fallback" style="${src?'display:none':''}">${esc(initials)}</span>
 </div>`;
}

const activeAccount=()=>state.accounts.find(a=>a.id===state.activeId);

function toast(message){
 $('toast').textContent=message;
 $('toast').classList.remove('hidden');
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);
}

function showLogin(){

 $('dashboard').classList.add('hidden');
}

function showDashboard(){

function saveAccounts(){
 localStorage.setItem('danke_accounts',JSON.stringify(state.accounts));
 localStorage.setItem('danke_active',state.activeId||'');
}

function loadSaved(){
 try{
  state.accounts=JSON.parse(localStorage.getItem('danke_accounts')||'[]');
  state.activeId=localStorage.getItem('danke_active')||null;
 }catch{
  state.accounts=[];
  state.activeId=null;
 }

 state.accounts=state.accounts.filter(a=>a.sessionId);

 if(!activeAccount())state.activeId=state.accounts[0]?.id||null;
}

function apiHeaders(){
 const a=activeAccount();
 return a?.sessionId?{'X-Session-Id':a.sessionId}:{};
}

async function api(url,options={}){
 const headers={...apiHeaders(),...(options.headers||{})};

 if(options.body)headers['Content-Type']='application/json';

 const response=await fetch(url,{...options,headers});
 let data={};

 try{data=await response.json()}catch{}

 if(!response.ok){
  throw new Error(
   data.details?.message||
   data.error||
   data.message||
   `Request gagal (${response.status})`
  );
 }

 return data;
}

/* PROVIDER FORM */

function fillProviderSelect(){
 const providerSelect = $('provider');

 if (!providerSelect) {
  console.error('Elemen #provider tidak ditemukan');
  return;
 }

 if (!Array.isArray(window.PROVIDERS)) {
  console.error('window.PROVIDERS bukan array');
  return;
 }

 providerSelect.innerHTML = '';

 window.PROVIDERS.forEach(p => {
  const option = document.createElement('option');
  option.value = p.id;
  option.textContent = p.name;
  providerSelect.appendChild(option);
 });

 console.log('Provider dimuat:', providerSelect.options.length);
}

function selectedProvider(){
 return window.PROVIDERS.find(
  p => p.id === $('provider').value
 ) || window.PROVIDERS[window.PROVIDERS.length - 1];
}

function applyProvider(p){
 if (!p) return;

 $('provider').value = p.id;
 $('imapHost').value = p.imapHost || '';
 $('imapPort').value = p.imapPort || 993;
 $('imapSecure').value = String(p.imapSecure !== false);
 $('smtpHost').value = p.smtpHost || '';
 $('smtpPort').value = p.smtpPort || 465;
 $('smtpSecure').value = String(p.smtpSecure !== false);

 $('providerNote').textContent =
  p.notes ||
  (p.id === 'manual'
   ? 'Isi host IMAP dan SMTP sesuai informasi provider email kamu.'
   : 'Preset ' + p.name + ' dipilih. Pastikan pengaturan sesuai akun email kamu.');
}

function detectFromEmail(){

 applyProvider(p);
}

function initProviderForm(){

 if (window.PROVIDERS.length) applyProvider(window.PROVIDERS[0]);
}

 document.addEventListener('DOMContentLoaded', initProviderForm);

/* LOGIN AND ADD ACCOUNT */
let addingAccount=false;

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();

 const email=$('email').value.trim();
 const password=$('password').value;
 const p=selectedProvider();
 const host=$('imapHost').value.trim();

 if(!host){toast('IMAP host belum diisi.');return}
 if(!$('smtpHost').value.trim()){toast('SMTP host belum diisi.');return}

 const payload={
  host,
  port:Number($('imapPort').value)||993,
  secure:$('imapSecure').value==='true',
  username:email,
  password
 };

 const btn=$('connectBtn');
 btn.disabled=true;
 btn.textContent='Connecting...';

 try{
  const result=await fetch('/api/login',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(payload)
  });

  const data=await result.json().catch(()=>({}));

  if(!result.ok||!data.sessionId){
   throw new Error(
    data.details?.message||
    data.error||
    'Login gagal. Periksa email, password, dan host IMAP.'
   );
  }

  const account={
   id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
   email,
   sessionId:data.sessionId,
   providerId:p.id,
   providerName:p.name,
   imapHost:host,
   imapPort:Number($('imapPort').value)||993,
   imapSecure:$('imapSecure').value==='true',
   smtpHost:$('smtpHost').value.trim(),
   smtpPort:Number($('smtpPort').value)||465,
   smtpSecure:$('smtpSecure').value==='true'
  };

  state.accounts.push(account);
  state.activeId=account.id;
  state.page=1;
  saveAccounts();

  console.log('AKUN TERSIMPAN:', {
   email: account.email,
   sessionIdAda: !!account.sessionId,
   sessionIdPanjang: account.sessionId?.length
  });

  addingAccount=false;
  $('password').value='';
  $('loginForm').reset();
  applyProvider(window.PROVIDERS[0]);

  showDashboard();
  renderAccount();
  await loadFolders();
  await loadInbox(1);

  toast('Akun berhasil terhubung.');
 }catch(err){
  toast(err.message||'Tidak dapat terhubung.');
 }finally{
  btn.disabled=false;
  btn.textContent='Connect Account';
 }
});

function openAddAccount(){
 addingAccount=true;
 $('email').value='';
 $('password').value='';
 applyProvider(window.PROVIDERS[0]);
 showLogin();
 closeSidebar();
 $('email').focus();
}

/* ACCOUNT SWITCH / LOGOUT */
function renderAccount(){
 const a=activeAccount();
 if(!a)return;
 $('accountLabel').textContent=a.email;
}

$('accountSwitch').addEventListener('click',()=>{
 if(state.accounts.length<=1){
  toast('Hanya ada satu akun yang terhubung.');
  return;
 }

 const options=state.accounts.map((a,i)=>`${i+1}. ${a.email}`).join('\n');
 const choice=prompt('Pilih nomor akun:\n'+options);
 const index=Number(choice)-1;

 if(Number.isInteger(index)&&state.accounts[index]){
  state.activeId=state.accounts[index].id;
  state.currentFolder='INBOX';
  state.page=1;
  saveAccounts();

  renderAccount();

  loadFolders()
   .then(()=>loadInbox(1))
   .catch(e=>toast(e.message));
 }
});

$('addAccountBtn').addEventListener('click',openAddAccount);

$('logoutBtn').addEventListener('click',async()=>{
 const a=activeAccount();

 if(a){
  try{
   await api('/api/logout',{
    method:'POST',
    body:JSON.stringify({})
   });
  }catch{}
 }

 state.accounts=state.accounts.filter(x=>x.id!==state.activeId);
 state.activeId=state.accounts[0]?.id||null;
 saveAccounts();

 if(state.activeId){
  state.currentFolder='INBOX';
  state.page=1;
  renderAccount();
  await loadFolders();
  await loadInbox(1);
 }else{
  showLogin();
 }
});

/* FOLDERS */
function folderType(f){
 const s=(f.specialUse||'').toLowerCase();
 const n=(f.name||'').toLowerCase();

 if(s.includes('inbox')||n==='inbox')return 'inbox';
 if(s.includes('sent')||n.includes('sent')||n.includes('送信'))return 'sent';
 if(s.includes('draft')||n.includes('draft')||n.includes('下書き'))return 'drafts';
 if(s.includes('trash')||s.includes('deleted')||n.includes('trash')||n.includes('ゴミ箱'))return 'trash';
 if(s.includes('junk')||s.includes('spam')||n.includes('spam')||n.includes('迷惑'))return 'spam';
 if(n.includes('archive')||n.includes('all mail'))return 'archive';

 return 'folder';
}

const folderIcons={
 inbox:'▣',sent:'➤',drafts:'▤',trash:'⌫',
 spam:'⚠',archive:'▣',folder:'▰'
};

async function loadFolders(){
 const data=await api('/api/folders');

 state.folders=Array.isArray(data)?data:(data.folders||[]);

 if(!state.folders.length){
  state.folders=[{name:'INBOX',path:'INBOX',specialUse:'\\Inbox'}];
 }

 renderFolders();
}

function renderFolders(){
 const list=$('folderList');

 list.innerHTML=state.folders.map((f,i)=>{
  const type=folderType(f);
  const active=state.currentFolder===f.path&&!state.searchMode;

  return `<button class="folder-btn ${active?'active':''}" data-folder-index="${i}">
   <span>${folderIcons[type]||'▰'}</span>
   <span>${esc(f.name||f.path)}</span>
  </button>`;
 }).join('');

 list.querySelectorAll('[data-folder-index]').forEach(btn=>{
  btn.addEventListener('click',()=>{
   const f=state.folders[Number(btn.dataset.folderIndex)];

   state.currentFolder=f.path;
   state.page=1;
   state.searchMode=false;
   state.searchQuery='';
   state.selected.clear();

   $('searchInput').value='';
   $('clearSearchBtn').classList.add('hidden');

   closeSidebar();
   renderFolders();
   loadInbox(1);
  });
 });
}

function titleForFolder(){
 const f=state.folders.find(x=>x.path===state.currentFolder);
 return f?.name||state.currentFolder;
}

/* PAGINATION UI */
function updatePagination(){
 const total=Number(state.totalMessages)||0;
 const page=Number(state.page)||1;
 const size=Number(state.pageSize)||50;
 const pages=Math.max(1,Number(state.totalPages)||Math.ceil(total/size));

 const start=total===0?0:(page-1)*size+1;
 const end=Math.min(page*size,total);

 $('paginationInfo').textContent=
  total===0?'0 email':`${start}–${end} dari ${total} email`;

 $('pageIndicator').textContent=`Halaman ${page} / ${pages}`;

 $('prevPageBtn').disabled=page<=1;
 $('nextPageBtn').disabled=page>=pages||total===0;

 $('pageSizeSelect').value=String(size);
 $('pagination').classList.toggle('hidden',total===0);
}

function setPaginationData(data){
 state.totalMessages = Number(data.total) || 0;

 state.totalPages = Number(
  data.totalPages ?? Math.ceil(state.totalMessages / state.pageSize)
 ) || 0;

 const maxPage = Math.max(1, state.totalPages);

 state.page = Math.min(
  Math.max(1, Number(data.page) || state.page),
  maxPage
 );

 updatePagination();
}

/* MESSAGE LIST / INBOX */
async function loadInbox(page=1){
 state.page=Math.max(1,Number(page)||1);
 state.selected.clear();
 state.searchMode=false;
 state.searchQuery='';

 $('pageTitle').textContent=titleForFolder();
 $('pageSubtitle').textContent=activeAccount()?.email||'';

 $('listView').classList.remove('hidden');
 $('messageView').classList.add('hidden');
 $('clearSearchBtn').classList.add('hidden');

 $('mailList').innerHTML='<div class="empty">Loading messages...</div>';

 try{
  const params=new URLSearchParams({
   folder:state.currentFolder,
   page:String(state.page),
   limit:String(state.pageSize)
  });

  const data=await api('/api/inbox?'+params.toString());

  state.messages=data.messages||[];

  // Jika halaman terakhir kosong karena email dihapus,
  // kembali ke halaman sebelumnya.
  if(!state.messages.length&&state.page>1&&Number(data.total)>0){
   return loadInbox(state.page-1);
  }

  setPaginationData(data);
  renderMessages();

 }catch(err){
  state.messages=[];
  state.totalMessages=0;
  state.totalPages=0;
  updatePagination();

  $('mailList').innerHTML=
   `<div class="empty">${esc(err.message)}</div>`;
 }
}

function renderMessages(){
 const list=$('mailList');

 if(!state.messages.length){
  list.innerHTML='<div class="empty"><div class="big">✉</div>No messages found.</div>';
  return;
 }

 list.innerHTML=state.messages.map((m,i)=>{
  const uid=m.uid??m.id;
  const folder=m.folder||state.currentFolder;
  const key=folder+'::'+uid;

  const from=m.from?.text||m.from||m.sender||'(Unknown sender)';
  const subject=m.subject||'(No subject)';
  const date=m.date?new Date(m.date).toLocaleString():'';
  const preview=m.text?.replace(/\s+/g,' ').slice(0,130)||m.snippet||'';
  const cacheKey=folder+':'+uid;
  const cached=state.messageCache.get(cacheKey);

  const unread=cached
   ? false
   : !(m.flags||[]).includes('\\Seen')&&!m.seen;

  return `<div class="mail-row ${unread?'unread':''}" data-message-index="${i}">
   <input type="checkbox" data-select-key="${esc(key)}" ${state.selected.has(key)?'checked':''}>
   <div class="mail-info">
    <div class="sender-line">
     ${senderAvatar(from)}
     <div class="sender sender-name">${esc(from)}</div>
    </div>
    <div class="subject">${esc(subject)}</div>
    <div class="preview">${esc(preview)}</div>
   </div>
   <div class="mail-date">${esc(date)}</div>
  </div>`;
 }).join('');

 list.querySelectorAll('.mail-row').forEach(row=>{
  row.addEventListener('click',e=>{
   if(e.target.type==='checkbox')return;

   const m=state.messages[Number(row.dataset.messageIndex)];

   openMessage(
    m.uid??m.id,
    m.folder||state.currentFolder
   );
  });
 });

 list.querySelectorAll('[data-select-key]').forEach(cb=>{
  cb.addEventListener('change',()=>{
   if(cb.checked)state.selected.add(cb.dataset.selectKey);
   else state.selected.delete(cb.dataset.selectKey);
  });
 });
}

/* SEARCH WITH PAGINATION */
async function doSearch(page=1){
 const q=$('searchInput').value.trim();

 if(!q){
  state.page=1;
  loadInbox(1);
  return;
 }

 state.page=Math.max(1,Number(page)||1);
 state.searchMode=true;
 state.searchQuery=q;
 state.selected.clear();

 $('pageTitle').textContent='Search results';
 $('pageSubtitle').textContent='All folders · '+q;
 $('clearSearchBtn').classList.remove('hidden');

 $('mailList').innerHTML='<div class="empty">Searching all folders...</div>';

 $('listView').classList.remove('hidden');
 $('messageView').classList.add('hidden');

 try{
  const params=new URLSearchParams({
   q,
   folder:'ALL',
   page:String(state.page),
   limit:String(state.pageSize)
  });

  const data=await api('/api/search?'+params.toString());

  state.messages=data.messages||[];

  setPaginationData(data);
  renderMessages();

 }catch(err){
  state.messages=[];
  state.totalMessages=0;
  state.totalPages=0;
  updatePagination();

  $('mailList').innerHTML=
   `<div class="empty">${esc(err.message)}</div>`;
 }
}

/* PAGINATION BUTTONS */
$('prevPageBtn').addEventListener('click',()=>{
 if(state.page<=1)return;

 const nextPage=state.page-1;

 if(state.searchMode)doSearch(nextPage);
 else loadInbox(nextPage);
});

$('nextPageBtn').addEventListener('click',()=>{
 const pages=state.totalPages||Math.ceil(state.totalMessages/state.pageSize);

 if(state.page>=pages)return;

 const nextPage=state.page+1;

 if(state.searchMode)doSearch(nextPage);
 else loadInbox(nextPage);
});

$('pageSizeSelect').addEventListener('change',()=>{
 state.pageSize=Number($('pageSizeSelect').value)||50;
 state.page=1;

 if(state.searchMode)doSearch(1);
 else loadInbox(1);
});

let searchTimer;

$('searchInput').addEventListener('input',()=>{
 clearTimeout(searchTimer);

 searchTimer=setTimeout(()=>{
  doSearch(1);
 },450);
});

$('clearSearchBtn').addEventListener('click',()=>{
 $('searchInput').value='';
 $('clearSearchBtn').classList.add('hidden');
 state.searchMode=false;
 state.page=1;
 loadInbox(1);
});

$('refreshBtn').addEventListener('click',()=>{
 if(state.searchMode)doSearch(state.page);
 else loadInbox(state.page);
});

/* OPEN MESSAGE */

async function openMessage(uid,folder){
 const messageFolder=folder||state.currentFolder;
 const cacheKey=messageFolder+':'+uid;

 $('listView').classList.remove('hidden');
 $('messageView').classList.remove('hidden');

 // Tandai email sebagai sudah dibaca
 api('/api/message/action',{
  method:'POST',
  body:JSON.stringify({
   folder:messageFolder,
   uids:[uid],
   action:'read'
  })
 }).catch(err=>{
  console.error('Gagal menandai email sudah dibaca:',err);
 });

 // Tampilkan dari cache browser jika tersedia
 const cached=state.messageCache.get(cacheKey);

 if(cached){
  state.currentMessage=cached;
  renderMessage();
  return;
 }

 $('messageView').innerHTML=
  '<div class="empty">Opening message...</div>';

 try{
  const params=new URLSearchParams({
   folder:messageFolder
  });

  const msg=await api(
   '/api/message/'+encodeURIComponent(uid)+'?'+params.toString()
  );

  state.currentMessage={
   ...msg,
   uid,
   folder:messageFolder
  };

  // Simpan email ke cache browser
  state.messageCache.set(
   cacheKey,
   state.currentMessage
  );

  // Batasi cache maksimal 100 email
  while(state.messageCache.size>100){
   state.messageCache.delete(
    state.messageCache.keys().next().value
   );
  }

  renderMessage();

 }catch(err){
  $('messageView').innerHTML=`
   <div class="empty">
    ${esc(err.message)}
    <br><br>
    <button class="secondary" id="backToList">Back</button>
   </div>`;

  $('backToList')?.addEventListener(
   'click',
   backToList
  );
 }
}

function renderMessage(){
 const m=state.currentMessage;

 const from=m.from?.text||m.from||m.sender||'';
 const to=m.to?.text||m.to||'';
 const date=m.date?new Date(m.date).toLocaleString():'';
 const html=m.html||'';

 $('messageView').innerHTML=`
  <div class="message-toolbar">
   <button id="backMessage">← Back</button>
   <button id="replyMessage">↩ Reply</button>
   <button id="deleteMessage" class="danger">Delete</button>
  </div>

  <h2 style="font-size:21px;margin:0 0 14px">
   ${esc(m.subject||'(No subject)')}
  </h2>

  <div class="message-meta">
   <div class="sender-line" style="margin-bottom:12px">
    ${senderAvatar(from,true)}
    <strong class="sender-name">${esc(from)}</strong>
   </div>
   <div class="small muted">To: ${esc(to)}</div>
   <div class="small muted">${esc(date)}</div>
  </div>

  <div class="message-body" id="messageBody"></div>`;

 $('backMessage').onclick=backToList;

 $('deleteMessage').onclick=()=>{
  actionMessages('delete',[{
   uid:m.uid,
   folder:m.folder
  }]).then(backToList);
 };

 $('replyMessage').onclick=()=>{
  $('composeTo').value=(
   m.replyTo?.text||m.from?.text||m.from||''
  ).match(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/)?.[0]||'';

  $('composeSubject').value='Re: '+(m.subject||'');
  $('composeText').value='\n\n--- Original message ---\n'+(m.text||'');

  openCompose();
 };

 const body=$('messageBody');

 if(html){
  const iframe=document.createElement('iframe');
  iframe.setAttribute('sandbox','');

  iframe.srcdoc=
   '<!doctype html><html><head>'+
   '<meta name="viewport" content="width=device-width,initial-scale=1">'+
   '<style>body{font:14px Arial,sans-serif;overflow-wrap:anywhere}img{max-width:100%;height:auto}</style>'+
   '</head><body>'+html+'</body></html>';

  body.appendChild(iframe);
 }else{
  const pre=document.createElement('pre');
  pre.style.whiteSpace='pre-wrap';
  pre.textContent=m.text||'(No message content)';
  body.appendChild(pre);
 }
}

function backToList(){
 $('messageView').classList.add('hidden');
 $('listView').classList.remove('hidden');
}

/* BULK ACTIONS */
$('selectAllBtn').addEventListener('click',()=>{
 if(state.selected.size===state.messages.length){
  state.selected.clear();
 }else{
  state.messages.forEach(m=>{
   state.selected.add(
    (m.folder||state.currentFolder)+'::'+(m.uid??m.id)
   );
  });
 }

 renderMessages();
});

async function actionMessages(action,items){
 if(!items.length){
  toast('Pilih email terlebih dahulu.');
  return;
 }

 const groups={};

 items.forEach(item=>{
  const f=item.folder||state.currentFolder;
  (groups[f]||(groups[f]=[])).push(item.uid);
 });

 try{
  for(const [folder,uids] of Object.entries(groups)){
   await api('/api/message/action',{
    method:'POST',
    body:JSON.stringify({folder,uids,action})
   });
  }

  toast('Aksi berhasil dilakukan.');

  if(state.searchMode)await doSearch(state.page);
  else await loadInbox(state.page);

 }catch(err){
  toast(err.message);
 }
}

function selectedItems(){
 return [...state.selected].map(key=>{
  const split=key.lastIndexOf('::');

  return {
   folder:key.slice(0,split),
   uid:key.slice(split+2)
  };
 });
}

$('readBtn').onclick=()=>actionMessages('read',selectedItems());
$('unreadBtn').onclick=()=>actionMessages('unread',selectedItems());

$('deleteBtn').onclick=()=>{
 if(confirm('Hapus email yang dipilih?')){
  actionMessages('delete',selectedItems());
 }
};

/* COMPOSE / SEND */
function openCompose(){
 const a=activeAccount();
 if(!a)return;

 $('composeSmtpHost').value=a.smtpHost||'';
 $('composeSmtpPort').value=a.smtpPort||465;
 $('composeSmtpSecure').value=String(a.smtpSecure!==false);

 $('composeModal').classList.remove('hidden');
}

$('composeBtn').onclick=openCompose;

$('composeForm').addEventListener('submit',async e=>{
 e.preventDefault();

 const a=activeAccount();
 if(!a)return;

 const payload={
  to:$('composeTo').value.trim(),
  subject:$('composeSubject').value,
  text:$('composeText').value,
  smtpHost:$('composeSmtpHost').value.trim(),
  smtpPort:Number($('composeSmtpPort').value)||465,
  smtpSecure:$('composeSmtpSecure').value==='true'
 };

 try{
  await api('/api/send',{
   method:'POST',
   body:JSON.stringify(payload)
  });

  $('composeModal').classList.add('hidden');
  $('composeForm').reset();

  toast('Email berhasil dikirim.');

 }catch(err){
  toast(err.message);
 }
});

/* THEMES */
function applyTheme(){
 document.documentElement.style.setProperty(
  '--primary',
  state.theme.accent
 );

 document.documentElement.style.setProperty(
  '--primary2',
  state.theme.accent
 );

 if(state.theme.mode==='dark'){
  document.documentElement.style.setProperty('--bg','#171522');
  document.documentElement.style.setProperty('--surface','#211f2e');
  document.documentElement.style.setProperty('--surface2','#302c42');
  document.documentElement.style.setProperty('--text','#f2effb');
  document.documentElement.style.setProperty('--muted','#aaa4bd');
  document.documentElement.style.setProperty('--line','#393448');
 }else{
  document.documentElement.style.setProperty('--bg','#f5f3fb');
  document.documentElement.style.setProperty('--surface','#fff');
  document.documentElement.style.setProperty('--surface2','#f0edfa');
  document.documentElement.style.setProperty('--text','#211d32');
  document.documentElement.style.setProperty('--muted','#89849b');
  document.documentElement.style.setProperty('--line','#e9e5f1');
 }

 localStorage.setItem('danke_theme',JSON.stringify(state.theme));
}

try{
 state.theme={
  ...state.theme,
  ...JSON.parse(localStorage.getItem('danke_theme')||'{}')
 };
}catch{}

applyTheme();

$('themeBtn').onclick=()=>{
 $('modeSelect').value=state.theme.mode;
 $('themeModal').classList.remove('hidden');
};

document.querySelectorAll('[data-accent]').forEach(btn=>{
 btn.onclick=()=>{
  state.theme.accent=btn.dataset.accent;
  applyTheme();
 };
});

$('saveThemeBtn').onclick=()=>{
 state.theme.mode=$('modeSelect').value;
 applyTheme();

 $('themeModal').classList.add('hidden');
 toast('Theme updated.');
};

/* MODALS / MOBILE */
document.querySelectorAll('[data-close]').forEach(btn=>{
 btn.onclick=()=>{
  $(btn.dataset.close).classList.add('hidden');
 };
});

document.querySelectorAll('.modal-backdrop').forEach(bg=>{
 bg.addEventListener('click',e=>{
  if(e.target===bg)bg.classList.add('hidden');
 });
});

function openSidebar(){
 $('sidebar').classList.add('open');
 $('sidebarOverlay').classList.add('active');
 document.body.style.overflow='hidden';
}

function closeSidebar(){
 $('sidebar').classList.remove('open');
 $('sidebarOverlay').classList.remove('active');
 document.body.style.overflow='';
}

$('menuBtn').addEventListener('click',openSidebar);
$('sidebarClose').addEventListener('click',closeSidebar);
$('sidebarOverlay').addEventListener('click',closeSidebar);

 loadSaved();

 console.log('AKUN DIMUAT:', state.accounts.length);
 console.log('AKUN AKTIF:', !!activeAccount());
 console.log('SESSION ID ADA:', !!activeAccount()?.sessionId);

 if(activeAccount()){

  }
 }else{

 }
})();
</script>
